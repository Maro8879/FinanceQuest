}

function taskForm(){
  const t = curLevel().tasks[S.sel.idx], b = `levels.${S.sel.lv}.tasks.${S.sel.idx}`;
  let body = "";
  if (t.type === "choice"){
    body = `<label>Odpowiedzi <span class="hint">✓ = poprawna</span></label>` + t.options.map((o,i) => `<div class="line"><button class="ck ${o.correct?"on":""}" data-act="correct" data-i="${i}">✓</button><div class="f">${one(`${b}.options.${i}.text`, o.text, "Odpowiedź")}</div><button class="mini" data-act="opt" data-i="${i}" data-dir="-1">↑</button><button class="mini" data-act="opt" data-i="${i}" data-dir="1">↓</button><button class="mini x" data-act="opt" data-i="${i}" data-dir="0">✕</button></div>`).join("")
      + `<div class="btns"><button class="btn small" data-act="add-opt">+ odpowiedź</button><label style="margin:0 0 0 12px;display:flex;gap:6px;align-items:center"><input type="checkbox" data-check="${b}.multi" ${t.multi?"checked":""}> kilka poprawnych</label></div>`;
  } else if (t.type === "truefalse"){
    // Polecenie (wyżej) to stwierdzenie; tu tylko, czy jest prawdziwe. W aplikacji gracz wybiera True albo False.
    body = `<label>To stwierdzenie jest <span class="hint">w aplikacji gracz wybiera True / False</span></label>
      <div class="btns"><button class="btn small ${t.truth ? "main" : ""}" data-act="tf" data-v="1">✓ Prawdziwe</button>
      <button class="btn small ${t.truth ? "" : "main"}" data-act="tf" data-v="0">✕ Fałszywe</button></div>`;
  } else if (t.type === "tiles"){
    body = `<label>Zdanie do ułożenia <span class="hint">słowa rozdzielone spacją = kafelki</span></label>${one(`${b}.answer`, t.answer)}
      <label>Słowa-pułapki <span class="hint">po przecinku</span></label>${listIn(`${b}.extra`, t.extra, "np. zawsze, nigdy")}`;
  } else if (t.type === "pairs"){
    body = `<label>Pary <span class="hint">lewa ↔ prawa</span></label>` + t.pairs.map((p,i) => `<div class="line"><div class="f">${one(`${b}.pairs.${i}.left`, p.left, "Pojęcie")}</div><div class="f">${one(`${b}.pairs.${i}.right`, p.right, "Opis")}</div>${ctrl("pair", i)}</div>`).join("")
      + `<div class="btns"><button class="btn small" data-act="add-pair">+ para</button></div>`;
  } else if (t.type === "zones"){
    const zopts = Object.fromEntries([["","— strefa —"], ...t.zones.map(z => [z.id, z.label || z.id])]);
    body = `<label>Obrazek <span class="hint">ścieżka (opcjonalnie)</span></label>${one(`${b}.image`, t.image)}
      <label>Strefy <span class="hint">id · nazwa · x, y, szer., wys. (0–1 względem obrazka)</span></label>`
      + t.zones.map((z,i) => `<div class="grid6">${one(`${b}.zones.${i}.id`, z.id, "id")}${one(`${b}.zones.${i}.label`, z.label, "Nazwa strefy")}
        ${["x","y","w","h"].map(k => `<input type="number" step="0.05" min="0" max="1" data-bind="${b}.zones.${i}.${k}" data-num="1" value="${esc(z[k])}">`).join("")}<button class="mini x" data-act="zone" data-i="${i}" data-dir="0">✕</button></div>`).join("")
      + `<div class="btns"><button class="btn small" data-act="add-zone">+ strefa</button></div>
      <label>Elementy do przeciągnięcia</label>` + t.items.map((it,i) => `<div class="line"><div class="f">${one(`${b}.items.${i}.text`, it.text, "Element")}</div><div style="width:160px">${sel(`${b}.items.${i}.zone`, it.zone, zopts)}</div><button class="mini x" data-act="item" data-i="${i}" data-dir="0">✕</button></div>`).join("")
      + `<div class="btns"><button class="btn small" data-act="add-item">+ element</button></div>`;
  } else if (t.type === "gap"){
    body = `<label>Tekst z luką <span class="hint">luka = ___ (trzy podkreślniki)</span></label>${one(`${b}.text`, t.text)}
      <label>Sposób odpowiedzi</label>${sel(`${b}.mode`, t.mode || "type", {type:"Wpisanie z klawiatury", choose:"Wybór z kafelków"})}
      <label>Poprawne odpowiedzi <span class="hint">po przecinku; pierwsza = główna, reszta = akceptowane alternatywy</span></label>${listIn(`${b}.answers`, t.answers, "np. koszyka, koszyczka")}
      ${t.mode === "choose" ? `<label>Błędne propozycje <span class="hint">po przecinku</span></label>${listIn(`${b}.wrong`, t.wrong, "np. portfela, banku")}` : ""}`;
  }
  return `<div class="h">Zadanie ${S.sel.idx+1} <span class="pill">${esc(TYPES[t.type] || OLD_TYPES[t.type] || t.type)}</span></div><div class="crumb">${esc(curChapter().title)} › ${esc(curLevel().title || "Level " + (S.sel.lv+1))} › zadanie ${S.sel.idx+1}</div>
    <div class="grid2"><div><label>Typ zadania</label>${sel(`${b}.type`, t.type, TYPES)}</div><div></div></div>
    <label>Polecenie / pytanie <span class="hint">Shift+Enter = nowa linia</span></label>${one(`${b}.prompt`, t.prompt)}
    ${body}
    <label>Wyjaśnienie po złej odpowiedzi</label>${multi(`${b}.explain`, t.explain)}
    <label>Ciekawostka po dobrej odpowiedzi</label>${multi(`${b}.fact`, t.fact)}
    ${warnBox(taskWarnings(t))}
    <div class="btns"><button class="btn small" data-act="back-level">← wróć do levelu</button></div>${metaLine(curChapterFile())}`;
}

function autoGrow(t){ t.style.height = "auto"; t.style.height = (t.scrollHeight + 4) + "px"; }

// ======================= render: podgląd =======================
function renderPreview(){
  const el = $("preview");
  if (!S.loaded){ el.innerHTML = ""; return; }
  const isTask = S.sel.part === "task";
  el.innerHTML = `<div class="rh">Podgląd na żywo
    <div style="display:flex;gap:6px">${isTask ? `<div class="seg">${[["q","Pytanie"],["good","Dobrze"],["bad","Źle"]].map(([k,v]) => `<span class="${S.mode===k?"on":""}" data-act="mode" data-mode="${k}">${v}</span>`).join("")}</div>` : ""}
    <div class="seg"><span class="${S.dark?"":"on"}" data-act="dark" data-v="0">Jasny</span><span class="${S.dark?"on":""}" data-act="dark" data-v="1">Ciemny</span></div></div></div>
    <div class="ph"><div class="phs ${S.dark?"dark":""}">${previewBody()}</div></div>`;
}

function previewBody(){
  const s = S.sel;
  if (s.part === "course"){
    const c = curCourse();
    return `<div class="pk" style="margin-top:0">MENU · KARTA KURSU</div><div style="height:12px"></div>` +
      S.courses.map(x => { const d = x.file.data; return `<div class="pcardc" style="background:${esc(d.color)};${x===c?"outline:3px solid var(--y);outline-offset:3px":""}"><div class="t">${esc(d.title)}</div><div class="s">${x.chapters.length} rozdz. · ${x.chapters.reduce((n,f)=>n+f.data.levels.length,0)} leveli</div></div>`; }).join("");
  }
  if (s.part === "chapter" || (s.part === "level" && curLevel().kind !== "lesson" && curLevel().kind !== "minigame")){
    const d = curChapter();
    return `<div class="pcardc" style="background:${esc(d.color)}"><div class="s" style="margin:0">ROZDZIAŁ ${s.ch+1}</div><div class="t" style="font-size:18px">${esc(d.title)}</div></div>` +
      d.levels.map((l,i) => `<div class="plevel ${i===s.lv?"cur":""}" style="margin-left:${[0,12,24,12][i%4]}px">Level ${i+1}<div class="s">${esc(l.title || KINDS[l.kind])}</div></div>`).join("");
  }
  const l = curLevel();
  if (s.part === "level" && l.kind === "lesson"){
    const n = l.pages.length, pi = Math.min(S.page || 0, Math.max(0, n-1)), p = l.pages[pi] || {blocks:[]};
    const last = pi === n - 1;
    return `<div class="pbar"><div class="pbx">✕</div><div class="pk" style="margin:0">LEKCJA${n > 1 ? ` · STRONA ${pi+1} Z ${n}` : ""}</div></div>
      <div class="pscroll">${p.blocks.map(blockPreview).join("") || '<div class="sub">(pusta strona)</div>'}</div>
      ${n > 1 ? `<div class="pdots">${l.pages.map((_,i)=>`<i class="${i===pi?"on":""}" data-act="ppage" data-i="${i}"></i>`).join("")}</div>` : ""}
      <div class="pbtn y" data-act="ppage" data-i="${last ? pi : pi+1}">${!last ? "DALEJ" : l.tasks.length ? "DO ZADAŃ" : "UKOŃCZ"}</div>`;
  }
  if (s.part === "level" && l.kind === "minigame" && l.minigame.game === "prawda-czy-pulapka"){
    const cs = l.minigame.cards.length ? l.minigame.cards : SCAM_DEFAULT, c = cs[0];
    return `<div class="pk">KARTA 1 Z ${cs.length}${l.minigame.cards.length ? "" : " · przykładowe"}</div>
      <div class="pa"><span class="sub" style="color:var(--pmut)">${esc(SCAM_TYPES[c.type] || c.type)} · ${esc(c.from)}</span><br>${esc(c.text)}</div>
      <div style="display:flex;gap:8px">${[["#B8432D","#8C3322","✕ PUŁAPKA"],["#2F7D51","#235E3D","✓ BEZPIECZNE"]].map(([bg,lip,t]) => `<div style="flex:1;text-align:center;font-weight:800;color:#fff;border-radius:12px;padding:12px 4px;background:${bg};box-shadow:0 4px 0 ${lip}">${t}</div>`).join("")}</div>
      <div class="sub" style="color:var(--pmut);margin-top:8px">Poprawnie: ${esc(SCAM_ANS[c.answer] || c.answer)} — ${esc(c.explain)}</div>`;
  }
  if (s.part === "level" && l.kind === "minigame")
    return `<div class="pk">MINI GRA</div><div class="pq">${esc(l.title || "Mini gra")}</div><div class="pa">Gra: <b>${esc(GAMES[l.minigame.game] || l.minigame.game || "—")}</b>${l.minigame.settings.map(x=>`<br>${esc(x.key)}: ${esc(x.value)}`).join("")}</div>
      <div class="sub" style="color:var(--pmut)">Podgląd samej gry pojawi się, gdy powstanie w aplikacji.</div><div class="pbtn y">GRAJ</div>`;
  return taskPreview(l.tasks[s.idx]);
}

// **x** -> pogrubienie (po zabezpieczeniu HTML). Niesparowane ** zostają jak są – tak samo jak w aplikacji.
function rich(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function blockPreview(b){
  switch (b.type){
    case "heading": return `<div class="bh">${rich(b.text)}</div>`;
    case "text": return `<div class="bt">${rich(b.text)}</div>`;
    case "callout": return `<div class="bc"><span class="bci">!</span><div>${rich(b.text)}</div></div>`;
    case "list": return `<div class="bl">${b.items.filter(x=>x.trim()).map(x=>`<div class="bli"><span class="blc"></span><div>${rich(x)}</div></div>`).join("")}</div>`;
    case "divider": return `<div class="bd"></div>`;
    case "offers": {
      const logo = b.image ? imageUrl(curCourse(), b.image) : null;
      return `<div class="bof"><div class="bofh"><div class="boft">${esc(b.text)}</div>${logo || b.caption ? `<div class="bofl">${logo ? `<img src="${logo}">` : ""}${b.caption ? `<span>${esc(b.caption)}</span>` : ""}</div>` : ""}</div>
        ${b.offers.filter(o => o.title.trim()).map(o => `<div class="bofr">${o.badge ? `<div class="bofb" style="background:${/^#?[0-9a-fA-F]{6}$/.test(o.badgeColor.trim()) ? "#" + o.badgeColor.trim().replace("#","") : "#0E4A55"}">${esc(o.badge)}</div>` : ""}
          <div style="flex:1"><div class="bof1"><b>${esc(o.title)}</b>${o.value ? `<span>${esc(o.value)}</span>` : ""}</div>${o.desc ? `<div class="bof2">${esc(o.desc)}</div>` : ""}</div></div>`).join("")}
        <div style="display:flex;justify-content:flex-end"><span class="bofbtn">${esc(b.button || "SEE MORE")} →</span></div></div>`;
    }
    case "table": {
      const cols = Math.max(1, ...b.rows.map(r => r.cells.length)), head = b.header && b.rows.length > 1;
      // Szerokości kolumn (%) i minimalne wysokości wierszy jak w aplikacji (ekran ~0.77 skali).
      const cw = Array.from({length: cols}, (_, ci) => Number((b.colWidths || [])[ci]) || 0);
      const cg = cw.some(x => x > 0) ? `<colgroup>${cw.map(x => x > 0 ? `<col style="width:${x}%">` : "<col>").join("")}</colgroup>` : "";
      return `<div class="btab ${b.style === "b" ? "tb" : "ta"}"><table>${cg}${b.rows.map((r, ri) => `<tr${Number(r.height) > 0 ? ` style="height:${Math.round(r.height * 0.77)}px"` : ""}>` + Array.from({length: cols}, (_, ci) => {
        const tag = head && ri === 0 ? "th" : "td"; return `<${tag}>${rich(r.cells[ci] ?? "")}</${tag}>`; }).join("") + "</tr>").join("")}</table></div>`;
    }
    case "space": return `<div style="height:${Math.min(200, Number(b.size)||0)}px"></div>`;
    case "video": {
      // W aplikacji: tap w obraz = pełny ekran, pasek pod spodem. Tu zwykły odtwarzacz – żeby obejrzeć, co wrzuciłeś.
      const main = b.video || b.videoSub, sub = b.video && b.videoSub ? b.videoSub : "";
      const on = sub && vidSubsOn, src = on ? sub : main;
      const url = src ? videoUrl(curCourse(), src) : null, other = sub ? videoUrl(curCourse(), on ? main : sub) : null;
      const btn = sub ? `<button class="bcc ${on ? "on" : ""}" data-act="vid-subs" ${other ? `data-other="${other}"` : "disabled"} title="Przełącz wersję z napisami / bez – od tego samego miejsca">CC</button>` : "";
      return `<div class="bvid">${url ? `<video src="${url}" controls playsinline preload="metadata"></video>` : `<div class="nov">🎬 ${esc(main || "brak filmiku")}</div>`}${btn}</div>${b.caption ? `<div class="bcap">${rich(b.caption)}</div>` : ""}`;
    }
    case "image": {
      const w = Math.max(30, Math.min(100, (Number(b.width)||1)*100)), mh = Number(b.maxHeight) || 220;
      const url = b.image ? imageUrl(curCourse(), b.image) : null, size = url ? imageSize[url] : null;
      // Jak w aplikacji: szerokość z bloku, wysokość z proporcji obrazka, ale nie więcej niż maks. wysokość (ekran ~0.77 skali).
      let h = Math.min(mh, 140), width = w + "%";
      if (size){
        const pw = 298 * w / 100; h = pw * size.h / size.w;
        if (h > mh * 0.77){ h = mh * 0.77; width = Math.round(h * size.w / size.h) + "px"; }   // za wysoki – węższy, proporcje zostają
      }
      return `<div class="bimg ${url ? "has" : ""}" style="width:${width};height:${Math.round(h)}px">${url ? `<img src="${url}" alt="">` : "🖼 " + esc(b.image || "brak obrazka")}</div>${b.caption ? `<div class="bcap">${rich(b.caption)}</div>` : ""}`;
    }
  }
  return "";
}

function taskPreview(t){
  const show = S.mode !== "q";
  let body = "";
  if (t.type === "choice"){
    body = t.options.map(o => `<div class="pa ${show && o.correct ? "ok" : ""} ${S.mode==="bad" && !o.correct && o === t.options.find(x=>!x.correct) ? "bad" : ""}">${esc(o.text)}</div>`).join("");
    if (t.multi) body = `<div class="sub" style="color:var(--pmut);margin:-6px 0 10px">Zaznacz wszystkie poprawne</div>` + body;
  } else if (t.type === "truefalse"){
    body = [["True", t.truth], ["False", !t.truth]].map(([txt, ok]) => `<div class="pa ${show && ok ? "ok" : ""} ${S.mode==="bad" && !ok ? "bad" : ""}">${txt}</div>`).join("");
  } else if (t.type === "tiles"){
    const words = t.answer.split(/\s+/).filter(Boolean), all = [...words, ...t.extra].sort((a,b)=>(a.length*7+a.charCodeAt(0))%5-(b.length*7+b.charCodeAt(0))%5);
    body = `<div class="slot">${show ? words.map(w=>`<span class="tile">${esc(w)}</span>`).join("") : ""}</div><div class="tiles">${(show ? t.extra : all).map(w=>`<span class="tile">${esc(w)}</span>`).join("")}</div>`;
  } else if (t.type === "pairs"){
    const rights = [...t.pairs].reverse();
    body = `<div class="pairs"><div>${t.pairs.map(p=>`<div class="pa ${show?"ok":""}">${esc(p.left)}</div>`).join("")}</div><div>${(show ? t.pairs : rights).map(p=>`<div class="pa ${show?"ok":""}">${esc(p.right)}</div>`).join("")}</div></div>`;
  } else if (t.type === "zones"){
    body = `<div class="zonebox">${t.zones.map(z => `<div class="zone" style="left:${z.x*100}%;top:${z.y*100}%;width:${z.w*100}%;height:${z.h*100}%">${esc(z.label || z.id)}
      ${show ? `<div style="position:absolute;top:22px;left:4px;right:4px;display:flex;flex-direction:column;gap:4px">${t.items.filter(i=>i.zone===z.id).map(i=>`<span class="tile" style="font-size:11.5px;padding:4px 6px">${esc(i.text)}</span>`).join("")}</div>` : ""}</div>`).join("")}</div>
      ${show ? "" : `<div class="tiles">${t.items.map(i=>`<span class="tile">${esc(i.text)}</span>`).join("")}</div>`}`;
  } else if (t.type === "gap"){
    const parts = t.text.split("___");
    body = `<div class="gapt">${esc(parts[0])}<span class="gap">${show ? esc(t.answers[0] || "") : "&nbsp;"}</span>${esc(parts.slice(1).join("___"))}</div>` +
      (t.mode === "choose" ? `<div class="tiles" style="margin-top:16px">${[...t.answers.slice(0,1), ...t.wrong].map(w=>`<span class="tile">${esc(w)}</span>`).join("")}</div>` : `<div class="pinput">Wpisz odpowiedź…</div>`);
  }
  const fb = S.mode === "good" ? `<div class="pfb good"><b>Dobrze!</b> ${esc(t.fact)}</div><div class="pbtn">DALEJ</div>`
           : S.mode === "bad" ? `<div class="pfb bad"><b>Nie tym razem.</b> ${esc(t.explain)}</div><div class="pbtn bad">ROZUMIEM</div>`
           : `<div class="pbtn y">SPRAWDŹ</div>`;
  return `<div class="pbar"><div class="pbx">✕</div><div class="ptrack"><i style="width:40%"></i></div></div>
    <div class="pk">${esc((TYPES[t.type] || "").toUpperCase())}</div><div class="pq">${esc(t.prompt)}</div>${body}${fb}`;
}

// ======================= edycja (zdarzenia) =======================
document.addEventListener("input", e => {
  const t = e.target, f = fileOfSel(); if (!f) return;
  if (t.dataset.bind){
    let v = t.value; if (t.dataset.num) v = v === "" ? 0 : Number(v);
    setPath(f.data, t.dataset.bind, v); markDirty(f); trackPage(t.dataset.bind);
    // Szerokość np. tylko 3. kolumny zostawiłaby „dziury” w liście (null w JSON) – Unity by tego nie wczytało.
    if (/\.colWidths\.\d+$/.test(t.dataset.bind)){ const cw = getPath(f.data, t.dataset.bind.replace(/\.\d+$/, "")); for (let k = 0; k < cw.length; k++) cw[k] = Number(cw[k]) || 0; }
    if (t.tagName === "TEXTAREA") autoGrow(t);
    if (t.tagName === "SELECT" || /\.(type|kind|mode)$/.test(t.dataset.bind) || /\.(id|label)$/.test(t.dataset.bind) && t.dataset.bind.includes("zones")) { if (t.tagName === "SELECT") { if (/\.type$/.test(t.dataset.bind)) normalizeTask(getPath(f.data, t.dataset.bind.replace(/\.type$/,""))); renderForm(); } }
    renderPreview(); renderBanner();
  } else if (t.dataset.lines){
    setPath(f.data, t.dataset.lines, t.value.split("\n")); markDirty(f); autoGrow(t); trackPage(t.dataset.lines); renderPreview(); renderBanner();
  } else if (t.dataset.list){
    setPath(f.data, t.dataset.list, t.value.split(/[,;]/).map(x=>x.trim()).filter(Boolean)); markDirty(f); renderPreview();
  } else if (t.dataset.check){
    setPath(f.data, t.dataset.check, t.checked); markDirty(f); renderPreview();
  }
});
// Podgląd pokazuje stronę, którą właśnie edytujesz.
function trackPage(bind){ const m = /\.pages\.(\d+)\./.exec(bind || ""); if (m) S.page = Number(m[1]); }
document.addEventListener("focusin", e => { const b = e.target.dataset?.bind || e.target.dataset?.lines; if (b && /\.pages\./.test(b)){ const old = S.page; trackPage(b); if (old !== S.page) renderPreview(); } });
document.addEventListener("change", e => {
  const bd = e.target.dataset?.bind;
  if (bd && /\.blocks\.\d+\.(image|video|videoSub)$/.test(bd) && curCourse()){
    const v = normImagePath(e.target.value, curCourse().id);
    if (v !== e.target.value){ e.target.value = v; e.target.dispatchEvent(new Event("input", {bubbles:true})); renderForm(); }
  } if (e.target.tagName === "SELECT") e.target.dispatchEvent(new Event("input", {bubbles:true})); });

// Pola jednolinijkowe: Enter nie dodaje linii (zatwierdza), Shift+Enter = nowa linia.
document.addEventListener("keydown", e => {
  if (e.target.classList?.contains("one") && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); e.target.blur(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); saveAll(); }
  // Ctrl+B: zaznaczony tekst -> **pogrubiony** (albo zdejmuje pogrubienie, gdy już jest).
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b" && e.target.tagName === "TEXTAREA"){
    e.preventDefault();
    const t = e.target, v = t.value; let a = t.selectionStart, z = t.selectionEnd;
    while (a < z && /\s/.test(v[a])) a++; while (z > a && /\s/.test(v[z-1])) z--;   // spacje zostają poza **
    const sel = v.slice(a, z);
    if (v.slice(a-2, a) === "**" && v.slice(z, z+2) === "**"){ t.value = v.slice(0, a-2) + sel + v.slice(z+2); t.setSelectionRange(a-2, z-2); }
    else { t.value = v.slice(0, a) + "**" + sel + "**" + v.slice(z); t.setSelectionRange(a+2, z+2); }
    t.dispatchEvent(new Event("input", {bubbles:true}));
  }
});
window.addEventListener("beforeunload", e => { if (dirtyFiles().length){ e.preventDefault(); e.returnValue = ""; } });

function moveIn(arr, i, dir){
  if (dir === 0){ if (!confirm("Usunąć?")) return false; arr.splice(i, 1); return true; }
  const j = i + dir; if (j < 0 || j >= arr.length) return false;
  [arr[i], arr[j]] = [arr[j], arr[i]]; return true;
}
function newTask(type){ const t = {type, prompt:"", explain:"", fact:""}; normalizeTask(t);
  if (type === "choice") t.options = [{text:"",correct:true},{text:"",correct:false},{text:"",correct:false}];
  if (type === "truefalse") t.truth = true;
  if (type === "pairs") t.pairs = [{left:"",right:""},{left:"",right:""},{left:"",right:""}];
  if (type === "gap"){ t.text = "Tekst z ___ luką."; t.mode = "type"; }
  if (type === "zones"){ t.zones = [{id:"a",label:"Strefa A",x:0.04,y:0.1,w:0.44,h:0.8},{id:"b",label:"Strefa B",x:0.52,y:0.1,w:0.44,h:0.8}]; t.items = [{text:"",zone:"a"}]; }
  return t; }
function uniqueLevelId(d){ let n = d.levels.length + 1; while (d.levels.some(l => l.id === "l" + n)) n++; return "l" + n; }

document.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]"); if (!a || a.closest(".modal")) return;
  const act = a.dataset.act, i = Number(a.dataset.i), dir = Number(a.dataset.dir);
  const f = fileOfSel(), l = curLevel(), t = l && S.sel.part === "task" ? l.tasks[S.sel.idx] : null;
  const changed = () => { markDirty(f); renderForm(); renderPreview(); renderTree(); };
  switch (act){
    case "open": return openFolder();
    case "reload-all": if (dirtyFiles().length && !confirm("Masz niezapisane zmiany. Wczytać wszystko od nowa i je porzucić?")) return; return Store.kind ? loadAll() : null;
    case "github": return openGhDialog();
    case "save": return saveAll();
    case "me": askName(); renderTree(); return;
    case "disk-reload": return reloadFile(f);
    case "disk-compare": return compareFile(f);
    case "sel": return select(Number(a.dataset.c), a.dataset.ch != null ? Number(a.dataset.ch) : -1, a.dataset.lv != null ? Number(a.dataset.lv) : -1);
    case "sel-task": S.sel.part = "task"; S.sel.idx = i; S.mode = "q"; return renderAll();
    case "back-level": S.sel.part = "level"; S.sel.idx = -1; return renderAll();
    case "mode": S.mode = a.dataset.mode; return renderPreview();
    case "dark": S.dark = a.dataset.v === "1"; return renderPreview();
    case "color": setPath(f.data, a.dataset.bind, a.dataset.color); return changed();
    case "correct": if (!t.multi) t.options.forEach(o => o.correct = false); t.options[i].correct = !t.options[i].correct || !t.multi; return changed();
    case "add-opt": t.options.push({text:"", correct:false}); return changed();
    case "opt": if (moveIn(t.options, i, dir)) changed(); return;
    case "add-pair": t.pairs.push({left:"", right:""}); return changed();
    case "pair": if (moveIn(t.pairs, i, dir)) changed(); return;
    case "add-zone": t.zones.push({id: String.fromCharCode(97 + t.zones.length), label:"", x:0.1, y:0.1, w:0.3, h:0.3}); return changed();
    case "zone": if (moveIn(t.zones, i, dir)) changed(); return;
    case "add-item": t.items.push({text:"", zone: t.zones[0]?.id || ""}); return changed();
    case "item": if (moveIn(t.items, i, dir)) changed(); return;
    case "add-page": l.pages.push({blocks:[newBlock("text")]}); S.page = l.pages.length - 1; return changed();
    case "page": if (moveIn(l.pages, i, dir)){ S.page = 0; changed(); } return;
    case "add-block": { const pi = Number(a.dataset.p); l.pages[pi].blocks.push(newBlock(a.dataset.type)); S.page = pi; return changed(); }
    case "block": { const pi = Number(a.dataset.p); S.page = pi; if (moveIn(l.pages[pi].blocks, i, dir)) changed(); return; }
    case "ppage": S.page = i; return renderPreview();
    case "tadd-row": case "tadd-col": case "trow": case "tcol": {
      const pi = Number(a.dataset.p), tb = l.pages[pi].blocks[Number(a.dataset.b)];
      const cols = Math.max(1, ...tb.rows.map(r => r.cells.length));
      if (act === "tadd-row") tb.rows.push({cells: Array(cols).fill("")});
      if (act === "tadd-col") tb.rows.forEach(r => { while (r.cells.length < cols) r.cells.push(""); r.cells.push(""); });
      if (act === "trow"){ if (tb.rows.length <= 1 || !confirm("Usunąć wiersz?")) return; tb.rows.splice(i, 1); }
      if (act === "tcol"){ if (cols <= 1 || !confirm("Usunąć kolumnę?")) return; tb.rows.forEach(r => r.cells.splice(i, 1)); if (tb.colWidths) tb.colWidths.splice(i, 1); }
      S.page = pi; return changed();
    }
    case "vid-subs": {
      // Jak w apce: podmieniamy plik, a czas i odtwarzanie zostają.
      const box = a.closest(".bvid"), v = box?.querySelector("video"); if (!v || !a.dataset.other) return;
      const t = v.currentTime, playing = !v.paused, mine = v.src;
      vidSubsOn = !vidSubsOn; a.classList.toggle("on", vidSubsOn);
      v.src = a.dataset.other; a.dataset.other = mine;
      v.addEventListener("loadedmetadata", () => { v.currentTime = Math.min(t, v.duration || t); if (playing) v.play(); }, {once: true});
      return;
    }
    case "add-offer": { const pi = Number(a.dataset.p); l.pages[pi].blocks[Number(a.dataset.b)].offers.push({title:"",value:"",desc:"",badge:"",badgeColor:""}); S.page = pi; return changed(); }
    case "offer": { const pi = Number(a.dataset.p); S.page = pi; if (moveIn(l.pages[pi].blocks[Number(a.dataset.b)].offers, i, dir)) changed(); return; }
    case "pick-image": if (e.target.closest("details")) return; pickTarget = {p: Number(a.dataset.p), b: Number(a.dataset.b)}; $("imgpick").click(); return;
    case "pick-video": if (e.target.closest("details")) return; pickTarget = {p: Number(a.dataset.p), b: Number(a.dataset.b), field: a.dataset.field}; $("vidpick").click(); return;
    case "add-setting": l.minigame.settings.push({key:"", value:""}); return changed();
    case "add-scam-card": l.minigame.cards.push({type:"sms", from:"", text:"", answer:"trap", explain:"", flags:[]}); return changed();
    case "scam-card": if (moveIn(l.minigame.cards, i, dir)) changed(); return;
    case "scam-defaults":
      if (l.minigame.cards.length && !confirm("Zastąpić obecne karty 6 przykładowymi?")) return;
      l.minigame.cards = clone(SCAM_DEFAULT); return changed();
    case "setting": if (moveIn(l.minigame.settings, i, dir)) changed(); return;
    case "add-task": l.tasks.push(newTask(a.dataset.type)); S.sel.part = "task"; S.sel.idx = l.tasks.length - 1; return changed();
    case "task-list": if (moveIn(l.tasks, i, dir)) changed(); return;
    case "tf": t.truth = a.dataset.v === "1"; return changed();
    case "level-list": if (moveIn(curChapter().levels, i, dir)){ clampSel(); changed(); } return;
    case "add-level": {
      const d = curChapter(), kind = a.dataset.kind || "lesson";
      const nl = {id: uniqueLevelId(d), kind, title: "", pages: kind === "lesson" ? [{blocks:[newBlock("heading"), newBlock("text")]}] : [], minigame: {game:"", settings:[]}, tasks: []};
      d.levels.push(nl); const cf = curChapterFile(); S.sel = {c:S.sel.c, ch:S.sel.ch, lv:d.levels.length-1, part:"level", idx:-1}; markDirty(cf); return renderAll();
    }
    case "move-chapter": { const c = curCourse(); if (moveIn(c.chapters, i, dir)){ c.file.data.chapters = c.chapters.map(x => x.name.replace(/\.json$/,"")); markDirty(c.file); renderAll(); } return; }
    case "delete-course": {
      const c = curCourse();
      if (!Store.kind){ alert("Kurs można usunąć po otwarciu folderu Content (Chrome/Edge) albo po połączeniu z GitHubem."); return; }
      const n = c.chapters.length;
      if (!confirm(`Usunąć cały kurs „${c.file.data.title}”?\n\nZniknie folder ${c.id} – ${n} rozdział(ów), obrazki i niezapisane zmiany w tym kursie. Tego nie da się cofnąć w edytorze.`)) return;
      if (prompt(`Dla pewności wpisz nazwę folderu kursu: ${c.id}`) !== c.id){ toast("Nie usunięto – nazwa się nie zgadza."); return; }
      try { await Store.removeCourse(c.id, "Usunięto kurs: " + c.id + (S.me ? " (" + S.me + ")" : "")); }
      catch(err){ alert("Nie udało się usunąć kursu: " + err.message); return; }
      for (const f of [c.file, ...c.chapters]) S.knownPaths.delete(f.path);
      S.courses.splice(S.sel.c, 1);
      S.sel = {c: S.courses.length ? 0 : -1, ch:-1, lv:-1, part: S.courses.length ? "course" : null, idx:-1};
      renderAll();
      toast("Usunięto kurs " + c.id + (Store.kind === "gh" ? " (commit na GitHubie)." : ". Pamiętaj o Commit + Push."));
      return;
    }
    case "move-course": {
      // Zamieniamy miejscami i numerujemy wszystkie kursy od nowa (1, 2, 3…), żeby „order” nigdy się nie dublował.
      const ci = Number(a.dataset.c), to = ci + Number(a.dataset.dir);
      if (to < 0 || to >= S.courses.length) return;
      const selCourse = S.courses[S.sel.c];
      [S.courses[ci], S.courses[to]] = [S.courses[to], S.courses[ci]];
      S.courses.forEach((c, k) => { if (c.file.data.order !== k + 1){ c.file.data.order = k + 1; markDirty(c.file); } });
      if (selCourse) S.sel.c = S.courses.indexOf(selCourse);
      return renderAll();
    }
    case "tree-move-chapter": {
      // Kolejność rozdziałów trzyma lista „chapters” w pliku kursu – zmienia się tylko ten jeden plik.
      const c = S.courses[Number(a.dataset.c)], chi = Number(a.dataset.ch), to = chi + Number(a.dataset.dir);
      if (to < 0 || to >= c.chapters.length) return;
      const selCh = S.sel.c === S.courses.indexOf(c) ? c.chapters[S.sel.ch] : null;
      [c.chapters[chi], c.chapters[to]] = [c.chapters[to], c.chapters[chi]];
      c.file.data.chapters = c.chapters.map(x => x.name.replace(/\.json$/,""));
      markDirty(c.file);
      if (selCh) S.sel.ch = c.chapters.indexOf(selCh);
      return renderAll();
    }
    case "tree-move-level": {
      // Kolejność leveli to kolejność w tablicy „levels” pliku rozdziału – zmienia się tylko ten jeden plik.
      // Postęp graczy jest zapisany po id levelu, więc przestawienie go nie gubi.
      const cf = S.courses[Number(a.dataset.c)].chapters[Number(a.dataset.ch)], lv = cf.data.levels;
      const li = Number(a.dataset.lv), to = li + Number(a.dataset.dir);
      if (to < 0 || to >= lv.length) return;
      const here = S.sel.c === Number(a.dataset.c) && S.sel.ch === Number(a.dataset.ch);
      const selLv = here ? lv[S.sel.lv] : null;
      [lv[li], lv[to]] = [lv[to], lv[li]];
      markDirty(cf);
      if (selLv) S.sel.lv = lv.indexOf(selLv);
      return renderAll();
    }
    case "add-chapter": {
      const c = S.courses[Number(a.dataset.c)]; const title = prompt("Tytuł nowego rozdziału:"); if (!title) return;
      let id = slug(title); while (c.chapters.some(x => x.name === id + ".json")) id += "-2";
      const data = {format:1, id, title, color: c.file.data.color, meta:{}, levels:[{id:"l1", kind:"lesson", title:"", pages:[{blocks:[newBlock("heading"), newBlock("text")]}], minigame:{game:"",settings:[]}, tasks:[]}]};
      const nf = {kind:"chapter", name: id + ".json", path: c.id + "/" + id + ".json", data, base: null, stamp: null, dirty:true, disk:false};
      S.knownPaths.add(nf.path);
      c.chapters.push(nf); c.file.data.chapters = c.chapters.map(x => x.name.replace(/\.json$/,"")); c.file.dirty = true;
      S.sel = {c: S.courses.indexOf(c), ch: c.chapters.length - 1, lv:-1, part:"chapter", idx:-1}; return renderAll();
    }
    case "delete-chapter": {
      const c = curCourse(), cf = curChapterFile();
      if (!confirm(`Usunąć rozdział „${cf.data.title}” (plik ${cf.name})?`)) return;
      if (Store.kind && cf.stamp){ try { await Store.remove(cf.path, cf.stamp, "Usunięto rozdział: " + cf.path + (S.me ? " (" + S.me + ")" : "")); } catch(err){ alert("Nie udało się usunąć pliku: " + err.message); return; } }
      S.knownPaths.delete(cf.path);
      c.chapters.splice(S.sel.ch, 1); c.file.data.chapters = c.chapters.map(x => x.name.replace(/\.json$/,"")); markDirty(c.file);
      S.sel = {c:S.sel.c, ch:-1, lv:-1, part:"course", idx:-1}; return renderAll();
    }
    case "add-course": {
      if (!Store.kind){ alert("Nowy kurs można dodać po otwarciu folderu Content (Chrome/Edge) albo po połączeniu z GitHubem."); return; }
      const title = prompt("Tytuł nowego kursu:"); if (!title) return;
      let id = slug(title); while (S.courses.some(c => c.id === id)) id += "-2";
      const data = {format:1, id, title, shortName: title.split(" ")[0], color: PALETTE.Petrol, art:"Portfolio", icon:"Chart", order: S.courses.length + 1, chapters:[], meta:{}};
      const nf = {kind:"course", name:"course.json", path: id + "/course.json", data, base: null, stamp: null, dirty:true, disk:false};
      S.knownPaths.add(nf.path); S.courses.push({id, file: nf, chapters: []});
      S.sel = {c: S.courses.length - 1, ch:-1, lv:-1, part:"course", idx:-1}; return renderAll();
    }
  }
});

// Test / podgląd bez folderu: FQ.load({"invest/course.json": "...", ...})
window.FQ = { load: map => { S.readOnly = true; loadFromMap(map); }, useDir: async d => { S.dir = d; Store.kind = "fs"; S.readOnly = false; await loadAll(); }, connectGh, Store, poll, state: S, select, serialize, saveAll };
renderAll();
</script>
