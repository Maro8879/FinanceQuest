<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Finance Quest – edytor treści</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Jeden plik, działa offline. Zapis prosto do folderu Content w repo (Chrome / Edge – File System Access API).
   Praca we dwóch: każdy edytuje u siebie, synchronizacja przez GitHub Desktop; jeden rozdział = jeden plik. */
:root{--pet:#0E4A55;--y:#F2C200;--yl:#B59100;--txt:#1D2B2F;--mut:#6F7A7C;--bg:#F5F3EE;--edge:#DAD5CA;--ok:#3E9A68;--bad:#C4553F;--mod:#B58100;--other:#6A5ACD;--lock:#E7E3DA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Rubik","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.top{height:56px;background:#fff;border-bottom:2px solid var(--edge);display:flex;align-items:center;gap:10px;padding:0 16px}
.logo{font-weight:800;font-size:18px;color:var(--pet);margin-right:auto;white-space:nowrap}
.logo span{font-weight:600;color:var(--mut);font-size:14px}
.btn{font-weight:600;font-size:13px;border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);border-radius:10px;padding:7px 12px;background:#fff;white-space:nowrap;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.btn.main{background:var(--y);border-color:var(--y);box-shadow:0 3px 0 var(--yl);font-weight:800}
.btn.main:disabled{opacity:.5;cursor:default}
.btn.small{padding:4px 9px;font-size:12px;box-shadow:0 2px 0 var(--edge)}
.btn.danger{color:var(--bad)}
.who{font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap}
.who b{color:var(--txt)}
.folder{font-size:13px;color:var(--mut);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ban{background:#FFF3C4;border-bottom:2px solid #F0D98A;font-size:13px;padding:8px 16px;font-weight:600;display:flex;gap:12px;align-items:center}
.ban.red{background:#FBE1DB;border-color:#EDB5A8}
.ban a{color:var(--txt);cursor:pointer;text-decoration:underline}
.cols{display:grid;grid-template-columns:290px 1fr 440px;min-height:0}
.tree{background:#fff;border-right:2px solid var(--edge);overflow:auto;padding:12px}
.th{font-weight:800;font-size:11.5px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin:4px 0 6px}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:600}
.row:hover{background:#F2EFE8}
.row.sel{background:#E7F0F1}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
/* strzałki kolejności: widoczne po najechaniu albo na zaznaczonym wierszu */
.mv{display:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--edge);background:#fff;color:var(--mut);font-size:11px;font-weight:800;line-height:15px;text-align:center;flex:none;cursor:pointer}
.mv:hover{border-color:var(--pet);color:var(--pet)}
.mv.off{opacity:.3;pointer-events:none}
.row:hover .mv,.row.sel .mv{display:block}
.st{font-size:11px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--ok)} .st.mod{color:var(--mod)} .st.disk{color:var(--bad)} .st.other{color:var(--other)} .st.warn{color:var(--bad)}
.course{font-weight:800}
.indent{margin-left:14px} .indent2{margin-left:28px} .indent3{margin-left:42px}
.sub{font-size:12.5px;color:var(--mut);font-weight:600}
.add{color:var(--pet);font-weight:800;font-size:13px;padding:6px 8px;cursor:pointer}
.center{overflow:auto;padding:20px 24px 60px}
.h{font-weight:800;font-size:19px;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:14px;font-weight:600}
.pill{font-size:12px;background:var(--pet);color:#fff;border-radius:20px;padding:4px 10px;font-weight:600}
label{display:block;font-weight:800;font-size:12px;color:var(--mut);margin:14px 0 5px;letter-spacing:.3px}
.hint{font-weight:600;color:#9A9488;margin-left:6px}
textarea,input[type=text],input[type=number],select{width:100%;background:#fff;border:2px solid var(--edge);border-radius:10px;padding:8px 11px;font:inherit;font-size:14px;color:var(--txt);resize:none;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--pet)}
textarea.one{overflow:hidden;line-height:1.35}
textarea.multi{min-height:64px;line-height:1.4}
.line{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
.line>.f{flex:1}
.ck{width:34px;height:36px;border-radius:9px;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;color:#ccc;font-weight:800;background:#fff;flex:none}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mini{width:30px;height:36px;border-radius:8px;border:2px solid var(--edge);background:#fff;color:var(--mut);font-weight:800;flex:none}
.mini.x{color:var(--bad)}
.card{background:#fff;border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card .ct{display:flex;gap:8px;align-items:center}
.warnbox{background:#FBE1DB;border:2px solid #EDB5A8;border-radius:10px;padding:8px 12px;margin:12px 0;font-size:13px;font-weight:600;color:#7A2E20}
.okbox{background:#DDF0E3;border:2px solid #B9DFC6;border-radius:10px;padding:8px 12px;margin:12px 0;font-size:13px;font-weight:600;color:#2C6E4A}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:9px;border:3px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sw.on{border-color:var(--y)}
.meta{margin-top:20px;font-size:12.5px;color:var(--mut)}
code{background:#EEE9DF;padding:1px 5px;border-radius:5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid6{display:grid;grid-template-columns:76px 1fr 62px 62px 62px 62px 30px;gap:6px;align-items:center;margin-bottom:6px}
.grid6 input[type=number]{padding:8px 4px;text-align:center}
.empty{max-width:560px;margin:80px auto;text-align:center}
.empty h2{font-size:24px;margin-bottom:10px}
.empty p{color:var(--mut);margin-bottom:8px;line-height:1.5}
/* podgląd */
.right{background:#E9E6DF;border-left:2px solid var(--edge);padding:14px;display:flex;flex-direction:column;align-items:center;overflow:auto}
.rh{font-weight:800;font-size:13px;color:var(--mut);align-self:stretch;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.seg{display:flex;border:2px solid var(--edge);border-radius:9px;overflow:hidden;background:#fff}
.seg span{padding:4px 9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mut)}
.seg span.on{background:var(--pet);color:#fff}
.ph{width:330px;height:680px;background:#111;border-radius:42px;padding:11px;flex:none}
.phs{width:100%;height:100%;background:var(--pbg);color:var(--ptxt);border-radius:32px;padding:44px 16px 16px;position:relative;overflow:hidden;--pbg:#F5F3EE;--ptxt:#1D2B2F;--pmut:#6F7A7C;--pcard:#fff;--pedge:#DAD5CA}
.phs.dark{--pbg:#10252A;--ptxt:#EEF2F1;--pmut:#9FB0B2;--pcard:#1A363C;--pedge:#2A4B52}
.pbar{display:flex;gap:10px;align-items:center}
.pbx{color:var(--pmut);font-weight:800}
.ptrack{flex:1;height:12px;background:var(--pedge);border-radius:6px;position:relative;overflow:hidden}
.ptrack i{position:absolute;left:0;top:0;bottom:0;background:var(--y);border-radius:6px}
.pk{font-weight:800;font-size:10.5px;letter-spacing:1.5px;color:var(--pmut);margin-top:18px}
.pq{font-weight:800;font-size:19px;margin:6px 0 14px;white-space:pre-wrap}
.pa{background:var(--pcard);border:2px solid var(--pedge);box-shadow:0 4px 0 var(--pedge);border-radius:14px;padding:11px 12px;font-size:13.5px;font-weight:600;margin-bottom:10px;white-space:pre-wrap}
.pa.ok{border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.pa.bad{border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--pcard);border:2px solid var(--pedge);box-shadow:0 3px 0 var(--pedge);border-radius:11px;padding:7px 10px;font-weight:600;font-size:13.5px}
.slot{min-height:46px;border-bottom:2px solid var(--pedge);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zonebox{position:relative;width:100%;aspect-ratio:4/3;background:var(--pcard);border:2px solid var(--pedge);border-radius:14px;margin-bottom:12px;overflow:hidden;background-size:cover;background-position:center}
.zone{position:absolute;border:2px dashed var(--pmut);border-radius:10px;display:flex;align-items:flex-start;justify-content:center;font-size:11.5px;font-weight:800;color:var(--pmut);padding-top:4px}
.gapt{font-size:17px;font-weight:600;line-height:1.6;white-space:pre-wrap}
.gap{display:inline-block;min-width:80px;border-bottom:3px solid var(--y);text-align:center;font-weight:800}
.pinput{background:var(--pcard);border:2px solid var(--pedge);border-radius:12px;padding:10px;margin-top:14px;color:var(--pmut)}
.pfb{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 70px;font-size:12.5px;white-space:pre-wrap}
.pfb.good{background:#DDF0E3;color:#2C6E4A}
.pfb.bad{background:#FBE1DB;color:#7A2E20}
.phs.dark .pfb.good{background:#1E4A36;color:#BFE6CC}
.phs.dark .pfb.bad{background:#4A2620;color:#F2C8BE}
.pbtn{position:absolute;left:16px;right:16px;bottom:16px;color:#fff;font-weight:800;text-align:center;border-radius:12px;padding:11px;background:var(--ok);box-shadow:0 4px 0 #2C7550}
.pbtn.y{background:var(--y);color:var(--txt);box-shadow:0 4px 0 var(--yl)}
.pbtn.bad{background:var(--bad);box-shadow:0 4px 0 #933E2D}
.ptext{font-size:15.5px;line-height:1.55;white-space:pre-wrap;margin-top:18px}
.pimg{width:100%;aspect-ratio:16/9;border-radius:14px;background:var(--pcard) center/cover;border:2px solid var(--pedge);margin-top:16px;display:flex;align-items:center;justify-content:center;color:var(--pmut);font-size:12px}
.pdots{display:flex;gap:6px;justify-content:center;position:absolute;left:0;right:0;bottom:72px}
.pdots i{width:7px;height:7px;border-radius:4px;background:var(--pedge)}
.pdots i.on{background:var(--y)}
.pcardc{border-radius:18px;padding:13px 15px;color:#fff;margin-bottom:12px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.pcardc .t{font-weight:800;font-size:16px;white-space:pre-wrap}
.pcardc .s{font-weight:600;font-size:12px;opacity:.8;margin-top:2px}
.plevel{border-radius:16px;padding:10px 13px;margin-bottom:10px;background:var(--pcard);border:2px solid var(--pedge);box-shadow:0 4px 0 var(--pedge);font-weight:800}
.plevel.cur{border-color:var(--y);box-shadow:0 4px 0 var(--yl)}
.plevel .s{font-weight:600;font-size:12px;color:var(--pmut)}
.pscroll{position:absolute;top:78px;left:16px;right:16px;bottom:104px;overflow:auto;scrollbar-width:none}
.pdots i{cursor:pointer}
.pbtn{cursor:pointer}
.bh{font-weight:800;font-size:21px;line-height:1.2;margin-bottom:10px;white-space:pre-wrap}
.bt{font-size:14.5px;line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
.bh b,.bt b,.bc b,.bli b,.bcap b{font-weight:800}
.bimg{margin:0 auto;border:2px solid var(--pedge);box-shadow:0 4px 0 var(--pedge);border-radius:14px;background:var(--pcard);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--pmut);text-align:center;padding:6px;word-break:break-all}
.bcap{font-size:11.5px;color:var(--pmut);font-weight:600;margin:6px 0 0}
.bimg,.bcap{margin-bottom:14px}.bimg+.bcap{margin-top:-8px}
.bof{background:#0B3A45;border-radius:16px;padding:12px 11px 11px;margin-bottom:14px;box-shadow:0 4px 0 #072830;color:#fff}
.bofh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.boft{font-weight:800;font-size:15px}
.bofl{display:flex;align-items:center;gap:5px}.bofl img{height:20px}.bofl span{font-weight:800;font-size:8.5px;letter-spacing:.5px}
.bofr{display:flex;gap:8px;align-items:center;background:#164F5C;border-left:3px solid #F2C200;border-radius:8px;padding:8px 9px;margin-bottom:6px}
.bofb{flex:none;width:32px;height:32px;border-radius:6px;font-size:7px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bof1{display:flex;justify-content:space-between;gap:6px;font-size:11.5px}.bof1 span{font-weight:600;white-space:nowrap}.bof2{font-size:10px;opacity:.75;margin-top:2px}
.bofbtn{background:#F2C200;color:#1D2B2F;font-weight:800;font-size:10.5px;padding:6px 12px;border-radius:999px;box-shadow:0 2px 0 #B59100;margin-top:3px;animation:bofp 3s infinite}
@keyframes bofp{0%,8%,100%{transform:translateY(0);box-shadow:0 2px 0 #B59100}2%,6%{transform:translateY(2px);box-shadow:0 0 0 #B59100}}
.bc{display:flex;gap:10px;align-items:center;background:var(--pcard);border:2px solid var(--y);box-shadow:0 4px 0 var(--yl);border-radius:14px;padding:10px 11px;font-size:13.5px;line-height:1.4;margin-bottom:14px;white-space:pre-wrap}
.bci{width:30px;height:30px;border-radius:15px;background:var(--y);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px;font-weight:800;color:var(--txt)}
.bl{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.bli{display:flex;gap:9px;align-items:baseline;font-size:14px;line-height:1.45}
.blc{width:7px;height:7px;border-radius:4px;background:var(--y);flex:none;transform:translateY(-2px)}
.bd{margin:6px 0 18px;border-top:2px solid var(--pedge)}
.drop{border:2px dashed var(--edge);border-radius:12px;background:#fff;padding:10px;display:flex;gap:12px;align-items:center;cursor:pointer;min-height:70px}
.drop:hover{border-color:var(--pet)}
.drop.over,.card.over{border-color:var(--y);background:#FFF8D6}
.drop img{width:96px;height:60px;object-fit:cover;border-radius:8px;border:2px solid var(--edge);flex:none}
.drop .dt{font-size:13px;font-weight:600;color:var(--mut);line-height:1.4}
.drop .dt b{color:var(--txt)}
.bimg img{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block}
.bvid{margin:0 auto 14px;border:2px solid var(--pedge);box-shadow:0 4px 0 var(--pedge);border-radius:14px;background:#1D2B2F;overflow:hidden;color:#fff;font-size:11.5px;text-align:center}
.bvid{width:fit-content;max-width:100%}
.bvid video{display:block;max-width:100%;max-height:300px;width:auto;height:auto;background:#000}
.bvid .nov{padding:30px 6px;word-break:break-all}
.bvid+.bcap{margin-top:-8px}
.bvid{position:relative}
.bcc{position:absolute;top:8px;right:8px;border:0;border-radius:6px;padding:3px 7px;font:800 11px Rubik,system-ui,sans-serif;background:rgba(255,255,255,.25);color:#fff;cursor:pointer}
.bcc.on{background:#F2C200;color:#1D2B2F}.bcc:disabled{opacity:.5;cursor:default}
.drop video{width:96px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:#000}
.bimg.has{padding:0;background:var(--pcard)}
.tgrid{display:grid;gap:5px;align-items:center;margin-bottom:6px}
.tgrid input{padding:6px 8px;font-size:13px;border-radius:8px}
.tgrid input.thc{background:#E7F0F1;font-weight:800}.tgrid input.c0{font-weight:700}
.tgrid input.tsz{padding:4px 6px;font-size:11.5px;background:#F5F3EE;text-align:center}
.tgrid .tsl{font-size:10.5px;font-weight:700;color:#6F7A7C;text-align:center}
.btab{margin-bottom:14px}.btab table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.btab th,.btab td{text-align:left;padding:7px 6px;vertical-align:top;white-space:pre-wrap}.btab td:first-child{font-weight:800}.btab b{font-weight:800}
.ta{border:2px solid var(--pedge);box-shadow:0 4px 0 var(--pedge);border-radius:14px;overflow:hidden;background:var(--pcard)}
.ta th{background:var(--pet);color:#fff;font-weight:800}.ta tr:nth-child(odd) td{background:var(--pbg)}
.tb th{font-weight:800;font-size:11px;letter-spacing:.6px;color:var(--pmut);text-transform:uppercase;border-bottom:2px solid var(--ptxt)}
.tb td{border-bottom:2px solid var(--pedge)}.tb tr:last-child td{border-bottom:0}
.modal{position:fixed;inset:0;background:rgba(15,25,28,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.modal .box{background:#fff;border-radius:16px;padding:20px 22px;width:560px;max-height:80vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:8px}
.modal ul{margin:8px 0 14px 18px;line-height:1.6}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:9px 16px;border-radius:12px;font-weight:600;z-index:20}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top"></div>
  <div id="banner"></div>
  <div class="cols">
    <div class="tree" id="tree"></div>
    <div class="center" id="form"></div>
    <div class="right" id="preview"></div>
  </div>
</div>
<input type="file" id="pick" webkitdirectory multiple style="display:none">
<input type="file" id="imgpick" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">
<input type="file" id="vidpick" accept="video/mp4,.mp4" style="display:none">
<script>
"use strict";
// ======================= stałe =======================
const PALETTE = {Petrol:"#0E4A55", Moss:"#3F6B5C", Leaf:"#5E8A3A", Mustard:"#9C7A2E", Brick:"#8E4A36", Slate:"#4A5D73"};

const ICONS = ["Chart","Phone","Wallet","Card","Book","Star"];

// „Prawda czy Pułapka?”: rodzaje kart (tylko wygląd w aplikacji) i odpowiedzi.
const OLD_TYPES = {tiles:"Kafelki (wycofane)"};
const SCAM_TYPES = {sms:"SMS", social:"Reklama w social mediach", bank:"Aplikacja bankowa", article:"Artykuł sponsorowany", product:"Karta produktu", call:"Telefon"};
const SCAM_ANS = {trap:"✕ PUŁAPKA", safe:"✓ BEZPIECZNE"};
// Te same 6 kart, które aplikacja bierze, gdy level nie ma własnych (ScamDeck.Default) – tu do wstawienia i edycji.
const SCAM_DEFAULT = [
  {type:"social", from:"InvestAI · Sponsorowane", text:"Odkryj sekretny algorytm AI! Zainwestuj 250 € i odbierz gwarantowane 1 500 € zysku w 7 dni. Bez ryzyka!", answer:"trap", explain:"Red flag! Na legalnym rynku wysoki zysk zawsze oznacza ryzyko. Nikt nie może zagwarantować 500% zwrotu w tydzień.", flags:["gwarantowany zysk","bez ryzyka"]},

function slug(t){ return (t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30) || "nowy"; }
function ago(iso){
  if(!iso) return "";
  const m = Math.round((Date.now() - new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z").getTime())/60000);
  if (isNaN(m)) return "";
  if (m < 1) return "przed chwilą"; if (m < 60) return m + " min temu";
  const h = Math.round(m/60); if (h < 24) return h + " h temu";
  return new Date(iso).toLocaleDateString("pl-PL");
}

// ======================= magazyn plików: folder albo GitHub =======================
// Edytor posługuje się tylko ścieżkami „kurs/plik.json”. Skąd pliki przychodzą i dokąd idą, decyduje Store:
//  • folder (Chrome/Edge) – zapis prosto do repo na dysku, potem Commit + Push w GitHub Desktop;
//  • GitHub – zapis prosto do repozytorium przez API: każdy „Zapisz” to commit, GitHub Desktop niepotrzebny.
// Znacznik wersji pliku (stamp): w folderze czas zmiany, na GitHubie skrót (sha) – po nim poznajemy cudze zmiany.
const Store = {
  kind: null,          // "fs" | "gh" | null (tylko odczyt)
  gh: null,            // {owner, repo, branch, root, token}
  tree: {},            // GitHub: ścieżka względna -> {sha, size}

  async fsDir(parts, create){ let d = S.dir; for (const p of parts) d = await d.getDirectoryHandle(p, {create: !!create}); return d; },
  async fsFile(path, create){ const parts = path.split("/"); const d = await Store.fsDir(parts.slice(0, -1), create); return d.getFileHandle(parts[parts.length-1], {create: !!create}); },

  async api(method, url, body){
    const r = await fetch("https://api.github.com" + url, {method, cache: "no-store",
      headers: Object.assign({"Authorization": "Bearer " + Store.gh.token, "Accept": "application/vnd.github+json"}, body ? {"Content-Type": "application/json"} : {}),
      body: body ? JSON.stringify(body) : undefined});
    if (!r.ok){
      let msg = r.statusText; try { msg = (await r.json()).message || msg; } catch(e){}
      const e = new Error("GitHub " + r.status + ": " + msg); e.status = r.status; throw e;
    }
    return r.status === 204 ? null : r.json();
  },
  repoUrl(){ return "/repos/" + Store.gh.owner + "/" + Store.gh.repo; },
  ghPath(p){ return encPath(Store.gh.root.replace(/\/+$/, "") + "/" + p); },
  async refreshTree(){
    const t = await Store.api("GET", Store.repoUrl() + "/git/trees/" + encodeURIComponent(Store.gh.branch) + "?recursive=1");
    const pre = Store.gh.root.replace(/\/+$/, "") + "/", tree = {};
    for (const it of t.tree) if (it.type === "blob" && it.path.startsWith(pre)) tree[it.path.slice(pre.length)] = {sha: it.sha, size: it.size};
    Store.tree = tree;
    return tree;
  },

  // Wszystkie pliki treści: „kurs/plik.json” -> znacznik wersji.
  async listJson(){
    const out = {};
    if (Store.kind === "fs"){
      for await (const [name, h] of S.dir.entries()){
        if (h.kind !== "directory") continue;
        for await (const [fn, fh] of h.entries()) if (fh.kind === "file" && fn.endsWith(".json")) out[name + "/" + fn] = (await fh.getFile()).lastModified;
      }
    } else if (Store.kind === "gh"){
      for (const [p, v] of Object.entries(await Store.refreshTree())) if (/^[^/]+\/[^/]+\.json$/.test(p)) out[p] = v.sha;
    }
    return out;
  },
  async read(path){
    if (Store.kind === "fs"){ const f = await (await Store.fsFile(path)).getFile(); return {text: await f.text(), stamp: f.lastModified}; }
    const sha = Store.tree[path] && Store.tree[path].sha;
    const b = await Store.api("GET", Store.repoUrl() + "/git/blobs/" + sha);
    return {text: b64ToText(b.content), stamp: sha};
  },
  async stampOf(path){
    if (Store.kind === "fs"){ try { return (await (await Store.fsFile(path)).getFile()).lastModified; } catch(e){ return null; } }
    return Store.tree[path] ? Store.tree[path].sha : null;
  },
  // Zwraca nowy znacznik. Na GitHubie, gdy ktoś w międzyczasie zapisał plik, rzuca błąd 409 – wtedy scalamy i próbujemy jeszcze raz.
  async write(path, text, stamp, message){
    if (Store.kind === "fs"){
      const h = await Store.fsFile(path, true), w = await h.createWritable(); await w.write(text); await w.close();
      return (await h.getFile()).lastModified;
    }
    const body = {message, content: textToB64(text), branch: Store.gh.branch};
    if (stamp) body.sha = stamp;
    const r = await Store.api("PUT", Store.repoUrl() + "/contents/" + Store.ghPath(path), body);
    Store.tree[path] = {sha: r.content.sha, size: r.content.size};
    return r.content.sha;
  },
  async remove(path, stamp, message){
    if (Store.kind === "fs"){ const parts = path.split("/"); await (await Store.fsDir(parts.slice(0, -1))).removeEntry(parts[parts.length-1]); return; }
    await Store.api("DELETE", Store.repoUrl() + "/contents/" + Store.ghPath(path), {message, sha: stamp || (Store.tree[path] && Store.tree[path].sha), branch: Store.gh.branch});
    delete Store.tree[path];
  },
  async readBlob(path){
    if (Store.kind === "fs") return (await Store.fsFile(path)).getFile();
    const sha = Store.tree[path] && Store.tree[path].sha; if (!sha) throw new Error("brak pliku");
    const b = await Store.api("GET", Store.repoUrl() + "/git/blobs/" + sha);
    return new Blob([b64ToBytes(b.content)]);
  },
  async size(path){   // -1 = nie ma takiego pliku
    if (Store.kind === "fs"){ try { return (await (await Store.fsFile(path)).getFile()).size; } catch(e){ return -1; } }
    return Store.tree[path] ? Store.tree[path].size : -1;
  },
  // Usuwa cały folder kursu (rozdziały, obrazki, pliki .meta Unity). Na GitHubie – jednym commitem.
  async removeCourse(id, message){
    if (Store.kind === "fs"){
      await S.dir.removeEntry(id, {recursive: true});
      try { await S.dir.removeEntry(id + ".meta"); } catch(e){}   // .meta folderu – zostawiony narobiłby ostrzeżeń w Unity
      return;
    }
    await Store.refreshTree();
    const paths = Object.keys(Store.tree).filter(p => p.startsWith(id + "/") || p === id + ".meta");
    if (!paths.length) return;
    const root = Store.gh.root.replace(/\/+$/, "") + "/", br = encodeURIComponent(Store.gh.branch);
    for (let attempt = 0; attempt < 2; attempt++){
      const ref = await Store.api("GET", Store.repoUrl() + "/git/ref/heads/" + br);
      const head = await Store.api("GET", Store.repoUrl() + "/git/commits/" + ref.object.sha);
      const tree = await Store.api("POST", Store.repoUrl() + "/git/trees", {base_tree: head.tree.sha,
        tree: paths.map(p => ({path: root + p, mode: "100644", type: "blob", sha: null}))});
      const commit = await Store.api("POST", Store.repoUrl() + "/git/commits", {message, tree: tree.sha, parents: [ref.object.sha]});
      try { await Store.api("PATCH", Store.repoUrl() + "/git/refs/heads/" + br, {sha: commit.sha}); break; }
      catch(e){ if (attempt || e.status !== 422) throw e; }   // ktoś właśnie zrobił commit – próbujemy jeszcze raz od nowa
    }
    for (const p of paths) delete Store.tree[p];
  },
  async writeBlob(path, blob, message){
    if (Store.kind === "fs"){ const w = await (await Store.fsFile(path, true)).createWritable(); await w.write(blob); await w.close(); return; }
    const body = {message, content: bytesToB64(new Uint8Array(await blob.arrayBuffer())), branch: Store.gh.branch};
    if (Store.tree[path]) body.sha = Store.tree[path].sha;
    const r = await Store.api("PUT", Store.repoUrl() + "/contents/" + Store.ghPath(path), body);
    Store.tree[path] = {sha: r.content.sha, size: r.content.size};
  },
};
function encPath(p){ return p.split("/").map(encodeURIComponent).join("/"); }
function bytesToB64(u8){ let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBytes(b64){ const s = atob(String(b64).replace(/\s/g, "")); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function textToB64(t){ return bytesToB64(new TextEncoder().encode(t)); }
function b64ToText(b){ return new TextDecoder().decode(b64ToBytes(b)); }
function commitMsg(path){ return "Treść: " + path + (S.me ? " (" + S.me + ")" : ""); }

async function connectGh(cfg){
  const prev = {gh: Store.gh, kind: Store.kind};
  Store.gh = cfg; Store.kind = "gh";
  try { await Store.refreshTree(); }
  catch(e){ Store.gh = prev.gh; Store.kind = prev.kind; throw e; }
  S.dir = null; S.readOnly = false;
  await loadAll();
  if (!S.courses.length) toast("W folderze " + cfg.root + " nie ma jeszcze treści.");
}

async function loadAll(){
  const list = await Store.listJson(), paths = Object.keys(list);
  const texts = await Promise.all(paths.map(p => Store.read(p)));
  const by = {};
  paths.forEach((path, i) => {
    const [course, fn] = path.split("/");
    const file = makeFile(fn === "course.json" ? "course" : "chapter", fn, path, texts[i].text, texts[i].stamp);
    if (!file.data) return;
    by[course] = by[course] || {course: null, chapters: []};
    if (fn === "course.json") by[course].course = file; else by[course].chapters.push(file);
  });
  S.knownPaths = new Set(paths);
  finishLoad(Object.entries(by).filter(([, v]) => v.course).map(([id, v]) => ({id, file: v.course, chapters: orderChapters(v.course, v.chapters)})));
}

function loadFromMap(map){   // tryb bez zapisu (przeglądarka bez dostępu do folderu) oraz testy
  const by = {};
  for (const [path, text] of Object.entries(map)){
    const parts = path.split("/"); if (parts.length < 2) continue;
    const course = parts[parts.length-2], fn = parts[parts.length-1];
    by[course] = by[course] || {course:null, chapters:[]};
    const file = makeFile(fn === "course.json" ? "course" : "chapter", fn, course + "/" + fn, text, 0);
    if (!file.data) continue;
    if (fn === "course.json") by[course].course = file; else by[course].chapters.push(file);
  }
  finishLoad(Object.entries(by).filter(([,v])=>v.course).map(([id,v])=>({id, file:v.course, chapters: orderChapters(v.course, v.chapters)})));
}

// Plik w pamięci. base = wersja, od której zacząłeś edycję – dzięki niej da się połączyć Twoje zmiany z cudzymi.
function makeFile(kind, name, path, text, stamp){
  let data = null;
  try { data = JSON.parse(text); } catch(e){ alert("Błąd JSON w " + path + ": " + e.message); }
  if (data) normalizeData(kind, data, name);
  return {kind, name, path, data, base: data ? clone(data) : null, stamp, dirty:false, disk:false};
}
function normalizeData(kind, data, name){
  if (kind === "chapter") normalizeChapter(data, name);
  if (kind === "course"){ data.chapters = data.chapters || []; data.meta = data.meta || {}; }
  return data;
}

function normalizeChapter(d, name){
  d.id = d.id || name.replace(/\.json$/, "");
  d.levels = d.levels || []; d.meta = d.meta || {};
  for (const l of d.levels){
    l.pages = l.pages || []; l.tasks = l.tasks || []; l.minigame = l.minigame || {game:"", settings:[]};
    for (const pg of l.pages) normalizePage(pg);
    l.minigame.settings = l.minigame.settings || [];
    l.minigame.cards = l.minigame.cards || []; l.minigame.shuffle = !!l.minigame.shuffle;
    for (const c of l.minigame.cards){ c.flags = c.flags || []; c.answer = c.answer || "trap"; c.type = c.type || "sms"; }
    for (const t of l.tasks) normalizeTask(t);
  }
}
// Strona = lista bloków. Stary format (jeden tekst + obrazek) zamieniamy na bloki przy wczytaniu.
function normalizePage(pg){
  if (!pg.blocks || !pg.blocks.length){
    pg.blocks = [];
    if (pg.text) pg.blocks.push({type:"text", text: pg.text});
    if (pg.image) pg.blocks.push({type:"image", image: pg.image});
  }
  delete pg.text; delete pg.image;
  for (const b of pg.blocks) normalizeBlock(b);
}
function normalizeBlock(b){
  b.type = b.type || "text";
  if (b.type === "heading" || b.type === "text" || b.type === "callout") b.text = b.text ?? "";
  if (b.type === "image"){ b.image = b.image ?? ""; b.width = b.width ?? 1; b.maxHeight = b.maxHeight ?? 220; b.caption = b.caption ?? ""; }
  if (b.type === "video"){ b.video = b.video ?? ""; b.videoSub = b.videoSub ?? ""; b.caption = b.caption ?? ""; }
  if (b.type === "list") b.items = b.items || [];
  if (b.type === "space") b.size = b.size ?? 16;
  if (b.type === "offers"){
    // Karta ofert: tytuł (text), logo (image), nazwa obok logo (caption), wiersze, napis i link przycisku.
    for (const k of ["text","image","caption","button","url"]) b[k] = b[k] ?? "";
    b.offers = (b.offers || []).map(o => ({title:o.title ?? "", value:o.value ?? "", desc:o.desc ?? "", badge:o.badge ?? "", badgeColor:o.badgeColor ?? ""}));
  }
  if (b.type === "table"){
    b.rows = b.rows || []; b.header = b.header ?? true; b.style = b.style || "a";
    const cols = Math.max(1, ...b.rows.map(r => (r.cells || []).length));
    for (const r of b.rows){ r.cells = (r.cells || []).map(c => c ?? ""); while (r.cells.length < cols) r.cells.push(""); }   // równe wiersze – bez „dziur” w JSON
  }
}
function newBlock(type){ const b = {type}; normalizeBlock(b); if (type === "list") b.items = ["", ""];
  if (type === "offers") b.offers = [{title:"",value:"",desc:"",badge:"",badgeColor:""},{title:"",value:"",desc:"",badge:"",badgeColor:""}];
  if (type === "table") b.rows = [{cells:["", "Kolumna 1", "Kolumna 2"]}, {cells:["Wiersz 1", "", ""]}, {cells:["Wiersz 2", "", ""]}];
  return b; }
function normalizeTask(t){
  for (const k of ["options","extra","pairs","zones","items","answers","wrong"]) t[k] = t[k] || [];
  for (const k of ["prompt","answer","image","text","mode","explain","fact"]) t[k] = t[k] ?? "";
  t.multi = !!t.multi;
  // „truth” tylko w zadaniach prawda/fałsz – w innych typach nie dopisujemy pola, żeby nie zmieniać ich plików.
  if (t.type === "truefalse") t.truth = !!t.truth;
}

function orderChapters(courseFile, chapters){
  const order = courseFile.data.chapters || [];
  const byId = Object.fromEntries(chapters.map(c => [c.name.replace(/\.json$/,""), c]));
  const out = order.filter(id => byId[id]).map(id => byId[id]);
  for (const c of chapters.sort((a,b)=>a.name.localeCompare(b.name))) if (!out.includes(c)) out.push(c);
  return out;
}

function finishLoad(courses){
  courses.sort((a,b)=>(a.file.data.order||0)-(b.file.data.order||0) || a.id.localeCompare(b.id));
  S.courses = courses; S.loaded = true; S.newOnDisk = [];
  if (S.sel.c >= courses.length || S.sel.c < 0) S.sel = {c: courses.length ? 0 : -1, ch:-1, lv:-1, part: courses.length ? "course" : null, idx:-1};
  else clampSel();   // po ponownym wczytaniu zaznaczony level mógł zniknąć
  renderAll();
  if (!S.me) askName();
}

// ======================= zapis =======================
const allFiles = () => S.courses.flatMap(c => [c.file, ...c.chapters]);
const dirtyFiles = () => allFiles().filter(f => f.dirty);
function stampMeta(f){ f.data.meta = {editedBy: S.me, editedAt: new Date().toISOString().slice(0,19) + "Z"}; }   // UTC – ten sam czas u wszystkich

async function saveAll(){
  if (!S.me && !askName()) return;
  const list = dirtyFiles(); if (!list.length) { toast("Brak zmian do zapisania"); return; }
  if (!Store.kind){
    for (const f of list){ stampMeta(f); download(f.path.replace("/", "__"), serialize(f.data)); f.dirty = false; }
    renderAll(); return;
  }
  if (Store.kind === "gh") await Store.refreshTree().catch(() => {});
  let saved = 0;
  for (const f of list){
    try {
      // Ktoś zapisał ten plik, odkąd go wczytałeś? Najpierw dołączamy jego zmiany do Twoich.
      const now = await Store.stampOf(f.path);
      if (now && f.stamp && now !== f.stamp && !(await mergeRemote(f))) continue;
      stampMeta(f);
      try { f.stamp = await Store.write(f.path, serialize(f.data), f.stamp, commitMsg(f.path)); }
      catch(e){
        if (e.status !== 409 && e.status !== 422) throw e;
        if (Store.kind === "gh") await Store.refreshTree();
        if (!(await mergeRemote(f))) continue;
        stampMeta(f);
        f.stamp = await Store.write(f.path, serialize(f.data), f.stamp, commitMsg(f.path));
      }
      f.base = clone(f.data); f.dirty = false; f.disk = false; saved++;
    } catch(e){ alert("Nie udało się zapisać " + f.path + ":\n" + e.message); }
  }
  S.knownPaths = new Set([...S.knownPaths, ...allFiles().map(f => f.path)]);
  renderAll();
  if (saved) toast(Store.kind === "gh" ? "Zapisano na GitHubie (" + saved + " plik" + (saved > 1 ? "i" : "") + ")." : "Zapisano. Pamiętaj o Commit + Push w GitHub Desktop.");
}

function download(name, text){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type:"application/json"}));
  a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

// ======================= obrazki =======================
// Obrazki leżą w repo obok treści: Content/<kurs>/obrazki/<nazwa>. W JSON zapisujemy tylko „obrazki/<nazwa>”,
// więc ścieżka jest taka sama u każdego (bez C:\Users\...). Unity podpina je samo przy imporcie.
const IMG_DIR = "obrazki", IMG_MAX = 1600;
const imageCache = {}, imageSize = {}, imageLoading = {};

// Pełne ścieżki wpisane ręcznie (z czyjegoś dysku) przycinamy do części po folderze kursu.
function normImagePath(p, courseId){
  p = String(p || "").trim().replace(/^"|"$/g, "").replace(/\\/g, "/");
  const m = p.toLowerCase().indexOf("/content/" + String(courseId).toLowerCase() + "/");
  if (m >= 0) return p.slice(m + 10 + String(courseId).length);   // "/content/" + id + "/"
  const r = p.toLowerCase().indexOf("/resources/");
  if (r >= 0) return p.slice(r + 1);
  return p.replace(/^[.\/]+/, "");
}

// Adres do podglądu obrazka (czytany z folderu repo). Pierwsze wywołanie zaczyna wczytywanie i zwraca null.
function imageUrl(course, path){
  if (!course || !Store.kind || !path) return null;
  const key = course.id + "/" + path;
  if (imageCache[key]) return imageCache[key];
  if (!imageLoading[key]){
    imageLoading[key] = true;
    (async () => {
      try {
        const file = await Store.readBlob(course.id + "/" + path);
        const url = URL.createObjectURL(file);
        const bmp = await createImageBitmap(file); imageSize[url] = {w: bmp.width, h: bmp.height}; bmp.close?.();
        imageCache[key] = url; renderForm(); renderPreview();
      } catch(e){ /* brak pliku – zostaje zaślepka */ }
    })();
  }
  return null;
}

// Duże zdjęcia zmniejszamy (dłuższy bok maks. 1600 px) – telefon nie potrzebuje więcej, a repo i gra są lżejsze.
async function prepareImage(file){
  const bmp = await createImageBitmap(file);
  const big = Math.max(bmp.width, bmp.height) > IMG_MAX, keep = !big && (file.type === "image/png" || file.type === "image/jpeg");
  const ext = file.type === "image/jpeg" ? ".jpg" : ".png";
  if (keep){ bmp.close?.(); return {blob: file, ext}; }
  const k = Math.min(1, IMG_MAX / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  const blob = await new Promise(r => c.toBlob(r, ext === ".jpg" ? "image/jpeg" : "image/png", 0.9));
  return {blob, ext};
}

// Kopiuje obrazek do Content/<kurs>/obrazki i wpisuje ścieżkę do bloku (albo dodaje nowy blok na końcu strony).
async function addImage(file, pageIdx, blockIdx){
  const course = curCourse(), l = curLevel(), f = curChapterFile();
  if (!file || !file.type.startsWith("image/")) { toast("To nie jest obrazek (PNG lub JPG)."); return; }
  if (!Store.kind){ alert("Obrazki można dodawać po otwarciu folderu Content (Chrome/Edge) albo po połączeniu z GitHubem."); return; }
  const {blob, ext} = await prepareImage(file);
  if (Store.kind === "gh") await Store.refreshTree();
  const base = slug(file.name.replace(/\.[^.]+$/, "")) || "obrazek";
  let name = base + ext, n = 2;
  try {
    while (true){   // ta sama nazwa i ten sam rozmiar = ten sam obrazek, nie kopiujemy drugi raz
      const size = await Store.size(course.id + "/" + IMG_DIR + "/" + name);
      if (size === blob.size) break;
      if (size < 0){ await Store.writeBlob(course.id + "/" + IMG_DIR + "/" + name, blob, "Obrazek: " + course.id + "/" + IMG_DIR + "/" + name + (S.me ? " (" + S.me + ")" : "")); break; }
      name = base + "-" + (n++) + ext;
    }
  } catch(e){ alert("Nie udało się zapisać obrazka: " + e.message); return; }
  const path = IMG_DIR + "/" + name;
  const page = l.pages[pageIdx];
  if (blockIdx === "new" || blockIdx == null) page.blocks.push(Object.assign(newBlock("image"), {image: path}));
  else page.blocks[blockIdx].image = path;
  S.page = pageIdx; markDirty(f); renderForm(); renderPreview(); renderTree();
  toast("Dodano obrazek " + path);
}

let pickTarget = null;
$("imgpick").addEventListener("change", e => { const file = e.target.files[0]; e.target.value = ""; if (file && pickTarget) addImage(file, pickTarget.p, pickTarget.b); });
$("vidpick").addEventListener("change", e => { const file = e.target.files[0]; e.target.value = ""; if (file && pickTarget) addVideo(file, pickTarget.p, pickTarget.b, pickTarget.field); });

// ======================= filmiki =======================
// Tak samo jak obrazki: plik MP4 leży w repo w Content/<kurs>/filmy, w JSON tylko „filmy/<nazwa>.mp4”.
// Tylko MP4 (H.264) – ten format odtwarza każdy telefon bez dodatkowych kodeków.
const VID_DIR = "filmy", VID_WARN = 15 * 1024 * 1024, VID_MAX = 50 * 1024 * 1024;
const videoCache = {}, videoLoading = {};
let vidSubsOn = false;   // podgląd: która wersja filmiku jest włączona (jak przycisk CC w apce)
function videoUrl(course, path){
  if (!course || !Store.kind || !path) return null;
  const key = course.id + "/" + path;
  if (videoCache[key]) return videoCache[key];
  if (!videoLoading[key]){
    videoLoading[key] = true;
    (async () => {
      try { videoCache[key] = URL.createObjectURL(await Store.readBlob(key)); renderForm(); renderPreview(); }
      catch(e){ /* brak pliku – zostaje zaślepka */ }
    })();
  }
  return null;
}
function mb(n){ return (n / 1024 / 1024).toFixed(1).replace(".", ",") + " MB"; }

// Kopiuje filmik do Content/<kurs>/filmy i wpisuje ścieżkę do bloku (albo dodaje nowy blok na końcu strony).
// field: „video” = wersja bez napisów, „videoSub” = ta sama z napisami.
async function addVideo(file, pageIdx, blockIdx, field){
  field = field === "videoSub" ? "videoSub" : "video";
  const course = curCourse(), l = curLevel(), f = curChapterFile();
  if (!file || !(file.type === "video/mp4" || /\.mp4$/i.test(file.name))){ toast("Filmik musi być w formacie MP4 (np. z telefonu .mov przekonwertuj na .mp4)."); return; }
  if (!Store.kind){ alert("Filmiki można dodawać po otwarciu folderu Content (Chrome/Edge) albo po połączeniu z GitHubem."); return; }
  // Duży plik spowalnia repo, pobieranie apki i telefon – przy kilku MB wszystko chodzi płynnie.
  if (file.size > VID_MAX){ alert("Filmik ma " + mb(file.size) + " – za dużo (maks. " + mb(VID_MAX) + "). Zmniejsz go do 720p albo skróć."); return; }
  if (file.size > VID_WARN && !confirm("Filmik ma " + mb(file.size) + ". Najlepiej do ~15 MB (720p, krótki). Dodać mimo to?")) return;
  if (Store.kind === "gh") await Store.refreshTree();
  const base = slug(file.name.replace(/\.[^.]+$/, "")) || "filmik";
  let name = base + ".mp4", n = 2;
  try {
    toast("Kopiuję filmik…");
    while (true){   // ta sama nazwa i ten sam rozmiar = ten sam plik, nie kopiujemy drugi raz
      const size = await Store.size(course.id + "/" + VID_DIR + "/" + name);
      if (size === file.size) break;
      if (size < 0){ await Store.writeBlob(course.id + "/" + VID_DIR + "/" + name, file, "Filmik: " + course.id + "/" + VID_DIR + "/" + name + (S.me ? " (" + S.me + ")" : "")); break; }
      name = base + "-" + (n++) + ".mp4";
    }
  } catch(e){ alert("Nie udało się zapisać filmiku: " + e.message); return; }
  const path = VID_DIR + "/" + name;
  const page = l.pages[pageIdx];
  if (blockIdx === "new" || blockIdx == null) page.blocks.push(Object.assign(newBlock("video"), {[field]: path}));
  else page.blocks[blockIdx][field] = path;
  S.page = pageIdx; markDirty(f); renderForm(); renderPreview(); renderTree();
  toast("Dodano filmik " + path);
}

// Przeciąganie plików z Eksploratora. Bez tego przeglądarka otworzyłaby obrazek zamiast edytora.
function dropTarget(e){ return e.target.closest?.("[data-drop]"); }
document.addEventListener("dragover", e => {
  e.preventDefault();
  document.querySelectorAll(".over").forEach(x => x.classList.remove("over"));
  const t = dropTarget(e); if (t) t.classList.add("over");
});
document.addEventListener("dragleave", e => { if (!e.relatedTarget) document.querySelectorAll(".over").forEach(x => x.classList.remove("over")); });
document.addEventListener("drop", e => {
  e.preventDefault();
  document.querySelectorAll(".over").forEach(x => x.classList.remove("over"));
  const t = dropTarget(e), file = e.dataTransfer?.files?.[0];
  if (!t || !file) return;
  const [p, b, fld] = t.dataset.drop.split(":");
  // Filmik upuszczony na obrazek (albo odwrotnie) dostaje nowy blok – nie nadpisujemy bloku innego rodzaju.
  const isVid = file.type.startsWith("video/") || /\.mp4$/i.test(file.name), want = isVid ? "video" : "image";
  const blk = b === "new" ? null : curLevel()?.pages[Number(p)]?.blocks[Number(b)];
  (isVid ? addVideo : addImage)(file, Number(p), blk && blk.type === want ? Number(b) : "new", fld);
});

// ======================= współpraca: cudze zmiany i łączenie =======================
// Co chwilę sprawdzamy, czy ktoś zapisał pliki (folder: co 3 s, GitHub: co 20 s).
// Plik, którego nie zmieniałeś, wczytujemy po cichu. Plik z Twoimi niezapisanymi zmianami tylko oznaczamy –
// przy zapisie (albo po kliknięciu „Połącz”) edytor dołączy cudze zmiany do Twoich.
let polling = false, lastGhPoll = 0;
async function poll(force){
  if (!Store.kind || polling) return;
  if (Store.kind === "gh" && !force && Date.now() - lastGhPoll < 20000) return;
  polling = true; lastGhPoll = Date.now();
  try {
    const list = await Store.listJson();
    const quiet = [];
    let changed = false;
    for (const f of allFiles()){
      const st = list[f.path];
      if (st === undefined || !f.stamp || st === f.stamp) continue;
      if (f.dirty){ if (!f.disk){ f.disk = true; changed = true; } }
      else quiet.push(f);
    }
    for (const f of quiet) await reloadFile(f, true);
    const found = Object.keys(list).filter(p => !S.knownPaths.has(p)).sort();
    if (found.length && !dirtyFiles().length){ await loadAll(); toast("Wczytano nowe pliki: " + found.join(", ")); }
    else if (found.join() !== S.newOnDisk.join()){ S.newOnDisk = found; changed = true; }
    if (quiet.length){ clampSel(); renderAll(); toast("Wczytano nowszą wersję: " + quiet.map(f => f.path).join(", ")); }
    else if (changed){ renderBanner(); renderTree(); }
  } catch(e){ /* brak sieci / folderu – spróbujemy za chwilę */ }
  finally { polling = false; }
}
setInterval(poll, POLL_MS);

// Wczytuje aktualną wersję pliku. Jeśli masz w nim niezapisane zmiany – łączy je z nową wersją (nic nie ginie).
async function reloadFile(f, silent){
  if (Store.kind === "gh") await Store.refreshTree().catch(() => {});
  if (f.dirty){
    if (!(await mergeRemote(f))) return;
    if (!silent){ clampSel(); renderAll(); toast("Połączono Twoje zmiany z nową wersją " + f.path + ". Zapisz, żeby je wysłać."); }
    return;
  }
  const r = await Store.read(f.path);
  const nf = makeFile(f.kind, f.name, f.path, r.text, r.stamp);
  Object.assign(f, {data: nf.data, base: nf.base, stamp: r.stamp, dirty:false, disk:false});
  const c = S.courses.find(c => c.file === f || c.chapters.includes(f));
  if (c && f.kind === "course") c.chapters = orderChapters(c.file, c.chapters);
  if (!silent){ clampSel(); renderAll(); toast("Wczytano nową wersję " + f.path); }
}

// Łączenie 3 wersji: base (od czego zacząłeś), mine (Twoja), theirs (zapisana przez kogoś innego).
// Rozdział łączymy level po levelu: zmienił tylko jeden z Was – bierzemy jego wersję; zmieniliście ten sam level – pytamy.
async function mergeRemote(f){
  const r = await Store.read(f.path);
  let theirs;
  try { theirs = normalizeData(f.kind, JSON.parse(r.text), f.name); } catch(e){ alert("Nowa wersja " + f.path + " ma błąd JSON – zostawiam Twoją."); return false; }
  const who = theirs.meta && theirs.meta.editedBy ? theirs.meta.editedBy : "kolega";
  const ask = what => confirm(`${what} – zmieniliście to oboje (Ty i ${who}).\n\nOK = zostaw moją wersję\nAnuluj = weź wersję od: ${who}`);
  const base = f.base || theirs;
  f.data = f.kind === "chapter" ? mergeChapter(base, f.data, theirs, ask) : mergeCourse(base, f.data, theirs, ask);
  f.base = clone(theirs); f.stamp = r.stamp; f.disk = false; f.dirty = true;
  const c = S.courses.find(c => c.file === f || c.chapters.includes(f));
  if (c && f.kind === "course") c.chapters = orderChapters(c.file, c.chapters);
  return true;
}
const js = o => JSON.stringify(o === undefined ? null : o);
function pick3(b, m, t, askFn){
  if (js(m) === js(t)) return m;
  if (js(m) === js(b)) return t;      // zmienił tylko on
  if (js(t) === js(b)) return m;      // zmieniłeś tylko Ty
  return askFn() ? m : t;
}
function mergeOrder(bIds, mIds, tIds){
  const seq = js(mIds) !== js(bIds) ? mIds.slice() : tIds.slice();
  for (const id of [...mIds, ...tIds]) if (!seq.includes(id)) seq.push(id);
  return seq;
}
function mergeChapter(base, mine, theirs, ask){
  const out = clone(theirs);
  out.title = pick3(base.title, mine.title, theirs.title, () => ask("Tytuł rozdziału"));
  out.color = pick3(base.color, mine.color, theirs.color, () => ask("Kolor rozdziału"));
  const by = a => Object.fromEntries((a.levels || []).map(l => [l.id, l]));
  const B = by(base), M = by(mine), T = by(theirs);
  const ids = mergeOrder((base.levels || []).map(l => l.id), mine.levels.map(l => l.id), (theirs.levels || []).map(l => l.id));
  out.levels = [];
  for (const id of ids){
    const name = ((M[id] || T[id] || B[id] || {}).title) || id;
    const l = pick3(B[id], M[id], T[id], () => ask(`Level „${name}”`));
    if (l) out.levels.push(clone(l));
  }
  out.meta = mine.meta;
  return out;
}
function mergeCourse(base, mine, theirs, ask){
  const out = clone(theirs);
  for (const k of ["title","shortName","color","art","icon","order"]) out[k] = pick3(base[k], mine[k], theirs[k], () => ask("Ustawienie kursu „" + k + "”"));
  const removed = (base.chapters || []).filter(id => !mine.chapters.includes(id) || !(theirs.chapters || []).includes(id));
  out.chapters = mergeOrder(base.chapters || [], mine.chapters, theirs.chapters || []).filter(id => !removed.includes(id));
  out.meta = mine.meta;
  return out;
}

async function compareFile(f){
  if (Store.kind === "gh") await Store.refreshTree().catch(() => {});
  const r = await Store.read(f.path);
  let disk; try { disk = JSON.parse(r.text); } catch(e){ alert("Nowa wersja ma błąd JSON."); return; }
  const lines = [];
  const mine = f.data;
  if (f.kind === "chapter"){
    if (disk.title !== mine.title) lines.push(`Tytuł: „${esc(disk.title)}” (nowa wersja) vs „${esc(mine.title)}” (Ty)`);
    const dl = Object.fromEntries((disk.levels||[]).map(l=>[l.id,l])), ml = Object.fromEntries((mine.levels||[]).map(l=>[l.id,l]));
    normalizeChapter(disk, f.name);
    for (const id of new Set([...Object.keys(dl), ...Object.keys(ml)])){
      const a = dl[id], b = ml[id];
      const name = esc((b||a).title || id);
      if (!b) lines.push(`Level „${name}” – jest tylko w nowej wersji`);
      else if (!a) lines.push(`Level „${name}” – jest tylko u Ciebie`);
      else if (js(a) !== js(b)) lines.push(`Level „${name}” – różni się`);
    }
  } else {
    for (const k of ["title","shortName","color","art","icon","order"]) if (disk[k] !== mine[k]) lines.push(`${k}: „${esc(disk[k])}” (nowa wersja) vs „${esc(mine[k])}” (Ty)`);
    if ((disk.chapters||[]).join() !== mine.chapters.join()) lines.push("Inna lista lub kolejność rozdziałów");
  }
  const who = disk.meta?.editedBy ? `${esc(disk.meta.editedBy)}, ${ago(disk.meta.editedAt)}` : "nieznany";
  modal(`<h3>Porównanie: ${esc(f.path)}</h3><div class="sub">Nową wersję zapisał: <b>${who}</b></div>
    ${lines.length ? "<ul>" + lines.map(l=>"<li>"+l+"</li>").join("") + "</ul>" : '<div class="okbox">Treść jest taka sama.</div>'}
    <div class="btns"><button class="btn main" data-act="modal-reload">${f.dirty ? "Połącz z moimi zmianami" : "Wczytaj nową wersję"}</button><button class="btn" data-act="modal-keep">Zostaw moją (nadpisz przy zapisie)</button></div>`,
    {reload: () => reloadFile(f), keep: () => { f.disk = false; f.stamp = r.stamp; f.base = normalizeData(f.kind, JSON.parse(r.text), f.name); f.dirty = true; renderAll(); }});
}

let modalActions = {};
function modal(html, actions){
  modalActions = actions || {};
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="box">${html}</div>`;
  m.addEventListener("click", e => {
    const a = e.target.closest("[data-act]")?.dataset.act;
    if (e.target === m || a){ m.remove(); if (a === "modal-reload") modalActions.reload?.(); if (a === "modal-keep") modalActions.keep?.(); }
  });
  document.body.appendChild(m);
}

const curCourse = () => S.courses[S.sel.c];
const curChapterFile = () => curCourse()?.chapters[S.sel.ch];
const curChapter = () => curChapterFile()?.data;
const curLevel = () => curChapter()?.levels[S.sel.lv];
function select(c, ch=-1, lv=-1, part=null, idx=-1){ S.sel = {c, ch, lv, part: part || (lv>=0?"level":ch>=0?"chapter":"course"), idx}; S.mode = "q"; S.page = 0; renderAll(); }
function clampSel(){
  const s = S.sel, c = S.courses[s.c];
  if (!c){ S.sel = {c:-1,ch:-1,lv:-1,part:null,idx:-1}; return; }
  if (s.ch >= c.chapters.length){ s.ch = -1; s.lv = -1; s.part = "course"; }
  const ch = c.chapters[s.ch]?.data;
  if (ch && s.lv >= ch.levels.length){ s.lv = -1; s.part = "chapter"; }
  const l = ch?.levels[s.lv];
  if (l && s.part === "task" && s.idx >= l.tasks.length){ s.part = "level"; s.idx = -1; }
}
function markDirty(f){ if (!f.dirty){ f.dirty = true; renderTop(); } renderTreeSoon(); }
function fileOfSel(){ return S.sel.part === "course" ? curCourse()?.file : curChapterFile(); }

// ======================= walidacja =======================
function taskWarnings(t){
  const w = [];
  if (!t.prompt.trim()) w.push("Brak polecenia.");
  if (t.type === "choice"){
    if (t.options.length < 2) w.push("Potrzebne co najmniej 2 odpowiedzi.");
    if (!t.options.some(o=>o.correct)) w.push("Zaznacz poprawną odpowiedź (✓).");
    if (!t.multi && t.options.filter(o=>o.correct).length > 1) w.push("Kilka poprawnych – włącz „kilka poprawnych”.");
  }
  if (t.type === "truefalse" && t.prompt.trim() && /\?\s*$/.test(t.prompt)) w.push("Polecenie ma być stwierdzeniem (bez „?”), które jest prawdziwe albo fałszywe.");
  if (t.type === "tiles" && !t.answer.trim()) w.push("Wpisz zdanie do ułożenia.");
  if (t.type === "pairs" && t.pairs.filter(p=>p.left.trim()&&p.right.trim()).length < 2) w.push("Potrzebne co najmniej 2 pełne pary.");
  if (t.type === "zones"){
    if (!t.zones.length) w.push("Dodaj strefy."); if (!t.items.length) w.push("Dodaj elementy do przeciągnięcia.");
    if (t.items.some(i => !t.zones.some(z => z.id === i.zone))) w.push("Element przypisany do nieistniejącej strefy.");
  }
  if (t.type === "gap"){
    if (!t.text.includes("___")) w.push("W tekście brakuje luki „___”.");
    if (!t.answers.length) w.push("Wpisz poprawną odpowiedź.");
  }
  if (!t.explain.trim()) w.push("Brak wyjaśnienia po złej odpowiedzi.");
  if (!t.fact.trim()) w.push("Brak ciekawostki po dobrej odpowiedzi.");
  return w;
}
function levelWarnings(l){
  const w = [];
  if ((l.kind === "task" || l.kind === "test") && !l.tasks.length) w.push("Level bez zadań.");
  if (l.kind === "minigame" && l.minigame.game === "prawda-czy-pulapka")
    l.minigame.cards.forEach((c, i) => {
      if (!String(c.text).trim()) w.push("Karta " + (i+1) + ": brak treści.");
      if (!String(c.explain).trim()) w.push("Karta " + (i+1) + ": brak wyjaśnienia.");
    });
  if (l.kind === "lesson" && !l.pages.length) w.push("Lekcja bez stron.");
  if (l.kind === "lesson") l.pages.forEach((pg, i) => {
    const pre = "Strona " + (i+1) + ": ";
    if (!pg.blocks.length) w.push(pre + "pusta strona.");
    for (const b of pg.blocks){
      if ((b.type === "text" || b.type === "heading" || b.type === "callout") && !String(b.text).trim()) w.push(pre + "pusty blok „" + BLOCKS[b.type] + "”.");
      if (b.type === "image" && !String(b.image).trim()) w.push(pre + "obrazek bez ścieżki.");
      if (b.type === "video" && !String(b.video).trim() && !String(b.videoSub || "").trim()) w.push(pre + "filmik bez ścieżki.");
      if (b.type === "list" && !b.items.some(x => x.trim())) w.push(pre + "pusta lista.");
      if (b.type === "table" && !b.rows.some(r => r.cells.some(c => String(c).trim()))) w.push(pre + "pusta tabelka.");
      if (b.type === "offers" && !b.offers.some(o => o.title.trim())) w.push(pre + "karta ofert bez wierszy.");
      if (b.type === "offers" && b.offers.some(o => o.badgeColor.trim() && !/^#?[0-9a-fA-F]{6}$/.test(o.badgeColor.trim()))) w.push(pre + "kolor plakietki musi mieć postać #RRGGBB.");
      if (b.type === "table" && (b.colWidths || []).reduce((s, x) => s + (Number(x) || 0), 0) > 100) w.push(pre + "kolumny tabelki mają razem ponad 100% – w aplikacji zostaną zwężone.");
      if (/\*\*/.test((b.text || "") + (b.items || []).join(" ")) && (((b.text || "") + (b.items || []).join(" ")).match(/\*\*/g).length % 2)) w.push(pre + "niesparowane ** (pogrubienie).");
    }
  });
  if (l.kind === "minigame" && !l.minigame.game) w.push("Wybierz mini grę.");
  return w.concat(...l.tasks.map(taskWarnings));
}
const chapterWarnCount = d => d.levels.reduce((n,l)=>n+levelWarnings(l).length, 0);

function renderBanner(){
  const f = fileOfSel();

  if (S.loaded && S.readOnly) h += `<div class="ban red"><div>⚠ Tryb tylko do odczytu – zmiany nie zapiszą się w repo, przycisk tylko pobierze pliki. ${browserHelp()}</div></div>`;
  if (f && f.disk) h += `<div class="ban">⚠ Ktoś zapisał nowszą wersję <b>${esc(f.path)}</b>, a Ty masz w nim niezapisane zmiany. Przy zapisie edytor połączy je automatycznie (zapyta tylko, gdy zmieniliście ten sam level).
      <a data-act="disk-reload">Połącz teraz</a> · <a data-act="disk-compare">Porównaj</a></div>`;

  if (others.length) h += `<div class="ban">Nowsza wersja czeka też w: ${others.map(x=>esc(x.path)).join(", ")} – połączy się przy zapisie.</div>`;

}

function status(f){
  if (f.dirty) return '<span class="st mod">● zmiany</span>';
  if (f.disk) return '<span class="st disk">⚠ na dysku</span>';
  const m = f.data.meta || {};
  if (m.editedBy && m.editedBy !== S.me) return `<span class="st other">${esc(m.editedBy)} · ${ago(m.editedAt)}</span>`;
  return '<span class="st ok">✓</span>';
}

// Strzałki ↑ ↓ przy kursie / rozdziale (pierwszy nie idzie wyżej, ostatni niżej).
const moveBtns = (act, i, n, data) => n < 2 ? "" :
  `<span class="mv ${i === 0 ? "off" : ""}" data-act="${act}" data-dir="-1" ${data} title="Wyżej">▲</span>` +
  `<span class="mv ${i === n - 1 ? "off" : ""}" data-act="${act}" data-dir="1" ${data} title="Niżej">▼</span>`;

function renderTree(){
  if (!S.loaded){ $("tree").innerHTML = '<div class="th">Pliki</div><div class="sub">Otwórz folder Content.</div>'; return; }
  let h = '<div class="th">Kursy i rozdziały</div>';
  S.courses.forEach((c, ci) => {
    const d = c.file.data, selC = S.sel.c === ci && S.sel.part === "course";
    h += `<div class="row course ${selC ? "sel" : ""}" data-act="sel" data-c="${ci}"><span class="dot" style="background:${esc(d.color)}"></span><span class="grow">${esc(d.title || c.id)}</span>${moveBtns("move-course", ci, S.courses.length, `data-c="${ci}"`)}${status(c.file)}</div>`;
    c.chapters.forEach((f, chi) => {
      const cd = f.data, open = S.sel.c === ci && S.sel.ch === chi, wc = chapterWarnCount(cd);
      h += `<div class="row indent ${open && S.sel.part === "chapter" ? "sel" : ""}" data-act="sel" data-c="${ci}" data-ch="${chi}">
        <span class="grow">${esc(f.name)}</span>${moveBtns("tree-move-chapter", chi, c.chapters.length, `data-c="${ci}" data-ch="${chi}"`)}${wc ? `<span class="st warn">⚠${wc}</span>` : ""}${status(f)}</div>`;
      if (open){
        cd.levels.forEach((l, li) => {
          const lw = levelWarnings(l).length;
          h += `<div class="row indent2 ${S.sel.lv === li && S.sel.part === "level" ? "sel" : ""}" data-act="sel" data-c="${ci}" data-ch="${chi}" data-lv="${li}">
            <span class="grow">${li+1} · ${esc(l.title || KINDS[l.kind])}</span><span class="sub">${KINDS[l.kind] || ""}</span>${moveBtns("tree-move-level", li, cd.levels.length, `data-c="${ci}" data-ch="${chi}" data-lv="${li}"`)}${lw ? `<span class="st warn">⚠</span>` : ""}</div>`;
          if (S.sel.lv === li && (l.kind === "task" || l.kind === "test" || l.tasks.length))
            l.tasks.forEach((t, ti) => h += `<div class="row indent3 sub ${S.sel.part === "task" && S.sel.idx === ti ? "sel" : ""}" data-act="sel-task" data-i="${ti}">
              <span class="grow">${ti+1} · ${esc(TYPES[t.type] || t.type)}</span>${taskWarnings(t).length ? '<span class="st warn">⚠</span>' : ""}</div>`);
        });
        h += `<div class="add indent2" data-act="add-level" data-kind="lesson">+ level</div>`;
      }
    });
    h += `<div class="add indent" data-act="add-chapter" data-c="${ci}">+ rozdział</div>`;
  });
  h += `<div class="add" data-act="add-course">+ nowy kurs</div>`;
  $("tree").innerHTML = h;
}

    body = `<label>Zadania</label>` + taskList(l);
  }
  return `<div class="h">Level ${S.sel.lv+1} <span class="pill">${KINDS[l.kind]}</span></div><div class="crumb">${esc(curChapter().title)} › ${esc(l.title || "Level " + (S.sel.lv+1))}</div>
    <div class="grid2"><div><label>Tytuł levelu</label>${one(`${b}.title`, l.title)}</div><div><label>Rodzaj</label>${sel(`${b}.kind`, l.kind, KINDS)}</div></div>
    ${body}${warnBox(levelWarnings(l).slice(0, 6))}${metaLine(f)}`;
}

function taskList(l){
  return l.tasks.map((t,i) => `<div class="line"><div class="f card" style="margin:0;padding:8px 12px;cursor:pointer" data-act="sel-task" data-i="${i}">
        <b>${i+1}. ${esc(TYPES[t.type] || OLD_TYPES[t.type] || t.type)}</b> <span class="sub">· ${esc((t.prompt || "").slice(0,50)) || "bez polecenia"}${taskWarnings(t).length ? " · ⚠" : ""}</span></div>${ctrl("task-list", i)}</div>`).join("")
      + `<div class="btns">${Object.entries(TYPES).map(([k,v]) => `<button class="btn small" data-act="add-task" data-type="${k}">+ ${v}</button>`).join("")}</div>`;
}

// Jeden blok strony: nagłówek z typem i strzałkami + pola zależne od typu.

    <details style="margin-top:6px"><summary class="sub" style="cursor:pointer">ścieżka ręcznie</summary>${one(`${bind}.image`, bl.image, "obrazki/nazwa.png")}</details>`;

  if (bl.type === "offers"){
    // Logo jak obrazek (to samo przeciąganie / wybór pliku), reszta to zwykłe pola tekstowe.
    const url = bl.image ? imageUrl(curCourse(), bl.image) : null;
    f = `<span class="sub">Tytuł karty</span>${one(`${bind}.text`, bl.text, "np. Savings accounts")}
      <div class="grid2" style="margin-top:6px"><div><span class="sub">Logo (prawy górny róg)</span>
      <div class="drop" data-act="pick-image" data-p="${p}" data-b="${j}" data-drop="${p}:${j}" style="min-height:44px">
        ${url ? `<img src="${url}" alt="" style="max-height:34px">` : `<div style="font-size:22px;flex:none">🏦</div>`}<div class="dt">${bl.image ? `<b>${esc(bl.image)}</b>` : "Przeciągnij logo albo kliknij"}</div></div></div>
      <div><span class="sub">Nazwa obok logo (opcjonalnie)</span>${one(`${bind}.caption`, bl.caption, "np. COMMERZBANK")}</div></div>
      <label style="margin-top:8px">Wiersze <span class="hint">plakietka = krótki napis na kolorowym kwadracie z lewej (np. iShares); wartość = po prawej (np. 0.75% p.a.)</span></label>`
      + bl.offers.map((o, i) => `<div class="line" style="align-items:flex-start"><div class="f card" style="margin:0;padding:8px">
          <div class="grid2"><div>${one(`${bind}.offers.${i}.title`, o.title, "Nazwa")}</div><div>${one(`${bind}.offers.${i}.value`, o.value, "Wartość (opcjonalnie)")}</div></div>
          <div style="margin-top:4px">${one(`${bind}.offers.${i}.desc`, o.desc, "Opis pod nazwą (opcjonalnie)")}</div>
          <div class="grid2" style="margin-top:4px"><div>${one(`${bind}.offers.${i}.badge`, o.badge, "Plakietka (opcjonalnie)")}</div><div>${one(`${bind}.offers.${i}.badgeColor`, o.badgeColor, "Kolor plakietki #RRGGBB")}</div></div>
        </div><div style="display:flex;flex-direction:column;gap:3px"><button class="mini" data-act="offer" data-p="${p}" data-b="${j}" data-i="${i}" data-dir="-1">↑</button><button class="mini" data-act="offer" data-p="${p}" data-b="${j}" data-i="${i}" data-dir="1">↓</button><button class="mini x" data-act="offer" data-p="${p}" data-b="${j}" data-i="${i}" data-dir="0">✕</button></div></div>`).join("")

      ${bl.rows.map((r, ri) => Array.from({length: cols}, (_, ci) =>
          `<input type="text" class="${bl.header && ri === 0 ? "thc" : ""} ${ci === 0 ? "c0" : ""}" data-bind="${bind}.rows.${ri}.cells.${ci}" value="${esc(r.cells[ci] ?? "")}">`).join("")
          + `<input type="number" class="tsz" min="0" max="300" step="5" placeholder="auto" title="Minimalna wysokość wiersza (puste = sama się dobiera)" data-bind="${bind}.rows.${ri}.height" data-num="1" value="${Number(r.height) || ""}">`

      ${Array.from({length: cols}, (_, ci) => `<button class="mini x" style="width:100%" data-act="tcol" data-p="${p}" data-b="${j}" data-i="${ci}" title="Usuń kolumnę">✕</button>`).join("")}<span></span><span></span></div>

  if (bl.type === "space") f = `<input type="number" step="4" min="0" max="200" data-bind="${bind}.size" data-num="1" value="${esc(bl.size)}">`;
  if (bl.type === "divider") f = `<div class="sub">Cienka linia oddzielająca części strony.</div>`;
